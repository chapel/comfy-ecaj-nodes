          - id: ac-6
            given: the node's INPUT_TYPES
            when: inspected
            then: it accepts a CLIP input type (ComfyUI standard CLIP type)
          - id: ac-7
            given: the CLIP object
            when: its state dict keys are accessed for architecture detection
