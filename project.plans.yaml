          - id: ac-3
            given: CLIP Entry node executes
            when: output is inspected
            then: no GPU memory is allocated and no tensors are copied
          - id: ac-4
            given: the node's RETURN_TYPES
            when: inspected
            then: it returns WIDEN_CLIP type
          - id: ac-5
            given: a non-SDXL CLIP
