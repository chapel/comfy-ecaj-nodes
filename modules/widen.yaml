      - _ulid: 01KHCRNGPTNBM5D6JG68N1A6RY
        slugs:
          - exit-model-persistence
        title: Exit Model Persistence
        type: requirement
        description: >-
          Opt-in save/cache for merged model output through the existing save_model boolean. When
          save_model is enabled, the Exit node writes or reuses an ecaj-owned saved model artifact
          for the current recipe and requested artifact kind using a safe model_name.


          For checkpoint-style source workflows, the saved artifact must be loadable through the
          appropriate ComfyUI checkpoint-style loader with the components required for normal
          generation and decode use. A diffusion-weight-only internal state file is not a complete
          checkpoint-style saved model artifact.


          For model kinds that are truly diffusion-only, a diffusion-weight artifact may be valid
          only when it is explicitly classified and validated as that artifact kind. Cache
          validation uses ecaj metadata including recipe identity, artifact kind, base model
          identity, and dependency fingerprints. The default save_model off path performs no file
          I/O.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: save_model toggle is disabled (default) and the Exit node is using in-memory patch output
              mode
            id: ac-1
            then: behavior is unchanged from baseline — no file I/O
            when: exit node executes
          - given: save_model is enabled, model_name is provided, and the Exit node has the components required
              for the requested saved model kind.
            id: ac-2
            then: The node publishes an ecaj-owned saved model artifact for the requested artifact kind using
              model_name. For checkpoint-style source workflows, the artifact is loadable through
              the appropriate checkpoint-style ComfyUI loader with the required conditioning and
              decode components, not merely as a diffusion-weight-only file.
            when: The Exit node completes the merge for the current recipe.
          - given: A saved artifact exists at the expected path and save_model is enabled.
            id: ac-3
            then: The saved artifact is accepted as a cache hit, the GPU merge pipeline is skipped, and
              subsequent output behavior follows the saved-output contract for that artifact kind.
            when: The Exit node executes and the artifact metadata matches the current recipe, requested
              artifact kind, base model identity, and dependency fingerprints.
          - given: A saved artifact exists at the expected path but its ecaj metadata does not match the current
              recipe, requested artifact kind, base model identity, or dependency fingerprints.
            id: ac-4
            then: The existing artifact is not accepted as a cache hit. The merge recomputes and publication
              proceeds only if the target is safe for ecaj-owned replacement.
            when: The Exit node executes with save_model enabled.
          - given: save_model enabled and model_name is empty or not provided
            id: ac-5
            then: raises clear error requesting a model name
            when: exit node validates inputs
          - given: A saved artifact written by the Exit node.
            id: ac-6
            then: The metadata identifies the serialized recipe tree with model objects replaced by stable
              source identities, the recipe identity hash, the requested artifact kind, the base
              model identity, and dependency fingerprints used for cache validation.
            when: The artifact is examined for metadata.
          - given: LoRA files on disk have changed (different mtime or size)
            id: ac-7
            then: cache is invalidated and merge recomputes
            when: exit node checks cache validity
          - given: A saved artifact written by the Exit node for a checkpoint-style source workflow.
            id: ac-8
            then: The loaded result functions as a complete checkpoint-style model for normal downstream
              generation and decode use, including the merged diffusion weights and required
              conditioning and decode components, without relying on the original in-memory WIDEN
              merge payload.
            when: The artifact is loaded through the appropriate ComfyUI checkpoint-style loader.
          - given: file with model_name already exists but lacks ecaj metadata in safetensors header
            id: ac-9
            then: raises error indicating file was not created by this node and suggests a different model_name
            when: exit node attempts save or cache-check
          - given: save_model is enabled and artifact creation reaches publication.
            id: ac-10
            then: Publication is atomic for the logical artifact target, so partial writes are not accepted as
              successful saved-model cache entries and do not replace a previously valid ecaj-owned
              artifact.
            when: The Exit node writes the saved artifact to disk.
          - given: model_name contains path separators or .. sequences
            id: ac-11
            then: raises clear error rejecting the model_name as unsafe
            when: exit node validates inputs
          - given: model_name provided without .safetensors extension
            id: ac-12
            then: .safetensors extension is appended automatically
            when: resolving the save path
          - given: save_model enabled and save_workflow toggle is enabled (default)
            id: ac-13
            then: ComfyUI workflow JSON is embedded in safetensors metadata alongside the recipe
            when: saving merged model to disk
          - given: save_model enabled and save_workflow toggle is disabled
            id: ac-14
            then: no workflow JSON is included in safetensors metadata
            when: saving merged model to disk
        tags: []
        created: 2026-02-14T00:26:32.026Z
        notes:
          - _ulid: 01KQCQEESCZN8GW17GT3WPW6WX
