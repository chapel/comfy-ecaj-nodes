  - _ulid: 01KH4HA4303B95N2GJDWJTD4GZ
    slugs:
      - exit-node
    title: Exit Node
    type: feature
    description: The only node that performs GPU computation. Receives the complete recipe tree,
      validates it, executes the full batched GPU pipeline, and returns a ComfyUI MODEL. In the
      default in-memory patch output mode, merged weights are installed as set patches on a
      ModelPatcher clone. Other output modes (such as full saved model output) may return a MODEL
      loaded from a saved artifact instead. Handles IS_CHANGED for LoRA file monitoring and reports
      progress.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: a valid recipe tree ending in RecipeMerge and the Exit node is using in-memory patch output
          mode (the default)
        id: ac-1
        then: it returns a ComfyUI MODEL (ModelPatcher clone) with merged weights installed as set patches
        when: Exit node executes
      - given: an invalid recipe tree with type mismatches
        id: ac-2
        then: it raises ValueError naming the invalid type and its position in the tree
        when: Exit node validates
      - given: a recipe tree with compose target containing multiple branches
        id: ac-3
        then: it calls merge_weights for simultaneous parameter routing
        when: Exit evaluates the merge step
      - given: a recipe tree with single LoRA target
        id: ac-4
        then: it calls filter_delta for importance filtering
        when: Exit evaluates the merge step
      - given: a chain where RecipeMerge base is another RecipeMerge
        id: ac-5
        then: inner merge evaluates first and its result becomes the base for outer merge
        when: Exit evaluates
      - given: a RecipeCompose with a single branch
        id: ac-6
        then: it treats it as filter_delta not merge_weights (single-branch passthrough)
        when: Exit evaluates the merge step
      - given: the Exit node output MODEL in in-memory patch output mode
        id: ac-7
        then: the additional LoRA patches apply additively on top of the set patches
        when: a downstream ComfyUI LoRA node applies additional patches
      - given: the base ModelPatcher uses bf16 weights and the Exit node is using in-memory patch output
          mode
        id: ac-8
        then: patch tensors match the base model storage dtype
        when: set patches are installed
      - given: the exit node processes multiple batch groups
        id: ac-9
        then: progress is reported via ComfyUI ProgressBar with value incrementing and max equal to total
          groups
        when: each batch group completes
      - given: system MemAvailable is below the estimated peak working set
        id: ac-10
        then: a RuntimeError is raised naming the shortfall before any GPU work begins
        when: execute() checks RAM before the GPU loop
    tags: []
    features:
      - _ulid: 01KQ6HR9SAYBTMC1C5FNQB7E7N
        slugs:
          - full-saved-model-output
        title: Full Saved Model Output
        type: feature
        description: >-
          The Exit node can produce a complete saved model artifact for a merge recipe in the model
          kind requested by the source workflow and return a MODEL that behaves like a normally
          loaded ComfyUI model for downstream execution.


          For checkpoint-style source workflows, complete means the saved artifact remains loadable
          through the appropriate checkpoint-style ComfyUI loader with the non-diffusion components
          needed for normal generation and decode use. A diffusion-weight-only artifact is not
          sufficient for checkpoint-style saved model output.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to:
          - "@exit-model-persistence"
          - "@memory-management"
          - "@exit-patch-install"
        tests: []
        traits: []
        acceptance_criteria:
          - given: A valid merge recipe starts from a source workflow whose normal ComfyUI use has a defined
              saved model kind.
            id: ac-complete-artifact
            then: The saved artifact is complete for that same model kind and can be loaded without relying on
              the original in-memory WIDEN merge payload. For checkpoint-style source workflows, the
              artifact includes the conditioning and decode components required by the appropriate
              checkpoint-style ComfyUI loader, not only the merged diffusion weights.
            when: The Exit node produces full saved model output for that recipe.
          - given: A full saved model artifact is produced or reused for the current recipe and requested saved
              model kind.
            id: ac-return-loaded-model
            then: Downstream nodes receive a MODEL representing the saved merged artifact through a supported
              return or load path for that artifact kind, and the result remains usable after
              temporary merge outputs have been released by the Exit node.
            when: The Exit node returns its MODEL output.
          - given: A saved full model artifact matches the current recipe identity, requested artifact kind, and
              required saved-model metadata.
            id: ac-cache-reuses-artifact
            then: The existing artifact is reused without recomputing the merged weights.
            when: The Exit node executes with save_model enabled for that same saved model kind.
          - given: A valid full saved model workflow selects a recipe that does not change any diffusion model
              weights.
            id: ac-no-op-produces-full-artifact
            then: Downstream nodes receive a MODEL backed by a complete saved model artifact for the selected
              recipe and requested saved model kind.
            when: The Exit node produces full saved model output for that recipe.
          - given: A saved full model artifact matches the current recipe identity, requested artifact kind, and
              required saved-model metadata.
            id: ac-cache-reuse-is-artifact-backed
            then: The reused result comes from the saved artifact rather than from a process-resident
              affected-weight payload.
            when: The Exit node reuses cached full saved model output.
        tags:
          - persistence
          - memory
          - comfy
        parent: "@exit-node"
        requirements:
          - _ulid: 01KQ6HR9TFYCFSNF14ZZ01QHNJ
            slugs:
              - streaming-full-model-materialization
            title: Streaming Full Model Materialization
            type: requirement
            description: |-
              Full model materialization keeps merge output memory bounded while creating
              the complete saved artifact. Completed affected weight groups can be handed
              off to artifact materialization without turning full saved model output into
              a process-resident affected-weight cache.
            status:
              maturity: draft
              implementation: implemented
            depends_on: []
            implements: []
            relates_to:
              - "@exit-model-persistence"
            tests: []
            traits: []
            acceptance_criteria:
              - given: |
                  A merge produces affected weights across multiple groups of model keys.
                id: ac-affected-results-released
                then: |
                  The operation can complete without requiring all affected weights to
                  remain resident until every later group has been evaluated.
                when: |
                  Full saved model mode records affected weights for the artifact.
              - given: |
                  The saved artifact must include base weights that are not affected by the
                  merge recipe.
                id: ac-base-weight-bounded-copying
                then: |
                  The operation does not require a second full model-sized in-memory copy
                  of all base weights at once.
                when: |
                  Full saved model mode creates the artifact.
              - given: |
                  Artifact creation fails before the full saved model is complete.
                id: ac-incomplete-write-not-reused
                then: |
                  No incomplete artifact is accepted as a successful cache hit on a later
                  execution.
                when: |
                  The Exit node handles the failure.
              - given: |-
                  Full saved model output is materializing affected weights for a merge recipe
                  with multiple affected groups.
                id: ac-direct-artifact-handoff
                then: |-
                  the completed group's affected tensors are handed to saved-artifact
                  materialization before evaluation of later affected groups begins, without
                  first accumulating a full all-groups affected-weight result in process memory.
                when: an affected weight group has completed evaluation.
              - given: Full saved model output has completed for a merge recipe.
                id: ac-full-cache-avoids-resident-payload
                then: |-
                  the reusable full-model cache does not require the recipe's affected weight
                  payload to remain resident in process memory.
                when: the result is made reusable for a later full saved model execution.
              - given: |-
                  Full saved model output fails after some affected weights have been produced
                  for artifact materialization.
                id: ac-failed-materialization-releases-resident-payload
                then: |-
                  partial affected weight payloads from that failed full saved model output
                  are not retained as a reusable full-model cache.
                when: the failure is reported to the workflow.
              - given: |-
                  Full saved model materialization includes a tensor using a
                  safetensors-supported dtype such as BF16.
                id: ac-raw-byte-dtype-preservation
                then: |-
                  The saved artifact reports the tensor's original dtype and shape, and the
                  stored tensor data is bitwise-equivalent to the source tensor without
                  numeric dtype conversion.
                when: |-
                  The tensor is written into the saved artifact by the streaming
                  materialization path.
            tags:
              - persistence
              - memory
            created: 2026-04-27T04:04:27.599Z
            notes: []
          - _ulid: 01KQ6HR9VECV6Q34JSTCRGWCDB
            slugs:
              - comfy-memory-manager-compatibility
            title: Comfy Memory Manager Compatibility
            type: requirement
            description: Saved model output remains compatible with ComfyUI's model memory lifecycle across
              supported memory-management modes for the requested saved model artifact kind. For
              checkpoint-style saved output, compatibility requires that ComfyUI can load and use
              the saved checkpoint-style artifact through normal loader and downstream workflow
              paths without changing the active memory mode.
            status:
              maturity: draft
              implementation: implemented
            depends_on: []
            implements: []
            relates_to:
              - "@memory-management"
            tests: []
            traits: []
            acceptance_criteria:
              - given: ComfyUI is running with its dynamic model memory management enabled.
                id: ac-no-dynamic-vram-opt-out
                then: The workflow can run without requiring users to disable ComfyUI's dynamic memory management.
                  If checkpoint-style output is requested, the saved artifact remains loadable
                  through the appropriate checkpoint-style ComfyUI loader in that memory mode.
                when: A workflow uses saved model output for a supported artifact kind.
              - given: The Exit node has returned a MODEL after producing or reusing saved model output.
                id: ac-comfy-owns-returned-model-memory
                then: The returned MODEL remains compatible with ComfyUI's model memory lifecycle and does not
                  require the transient WIDEN merge payload or a deep-copied ComfyUI model object to
                  remain resident solely because the Exit node returned.
                when: ComfyUI loads, unloads, partially loads, or prioritizes models for a workflow.
              - given: A representative merge workflow is run in an explicitly selected ComfyUI memory-management
                  mode.
                id: ac-measured-memory-report
                then: The validation output reports the active memory mode, saved artifact classification, loader
                  and downstream workflow result when applicable, returned-model behavior, artifact
                  reuse behavior, and whether transient merge outputs remain persistently resident
                  after the Exit node returns.
                when: memory behavior is measured for patch output, first saved model output, and saved artifact
                  reuse.
              - given: ComfyUI is running in a supported memory-management mode where Dynamic VRAM is not active.
                id: ac-non-dynamic-memory-mode-supported
                then: The workflow can produce and return the saved model output without requiring Dynamic VRAM to
                  be enabled.
                when: A workflow uses saved model output for a supported artifact kind.
              - given: ComfyUI has an active memory-management mode for the workflow.
                id: ac-memory-mode-preserved
                then: The workflow does not require users or the node to change that memory mode in order to
                  produce, load, reuse, or return the saved model output.
                when: A workflow uses saved model output.
              - given: A validation run is measuring saved model output under an explicitly selected ComfyUI
                  memory-management mode.
                id: ac-memory-validation-fails-on-mode-opt-out
                then: The validation reports the run as failed rather than treating the mode change as a successful
                  compatibility result.
                when: saved model output can only complete by changing or disabling that selected memory mode.
            tags:
              - comfy
              - memory
              - compatibility
            requirements:
