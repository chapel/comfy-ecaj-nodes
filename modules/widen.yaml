  - _ulid: 01KH4HA44KN101QT0AHV6JVW5J
    slugs:
      - memory-management
    title: Memory Management
    type: feature
    description: GPU memory lifecycle during and after merge execution. Covers per-chunk tensor cleanup,
      between-group GC cycles, loader resource teardown, and ensuring all final patches are
      CPU-only. Save-related memory ACs (streaming writes, GPU offload after save, base_state
      release before save) apply to the in-memory patch output mode's opt-in save path. Full saved
      model output mode has its own memory profile specified in
      @streaming-full-model-materialization and @comfy-memory-manager-compatibility.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: batched evaluation processes a chunk of parameters
        id: ac-1
        then: all GPU tensors for that chunk are deleted and freed
        when: the chunk completes and results transfer to CPU
      - given: an OpSignature group completes all chunks
        id: ac-2
        then: gc.collect() and torch.cuda.empty_cache() are called once after all groups complete, not
          between individual groups (OOM backoff handles per-group memory pressure)
        when: transitioning to the next group
      - given: all LoRA files have been loaded and evaluation is complete
        id: ac-3
        then: all loader resources are freed including delta caches and file handles
        when: cleanup runs
      - given: the complete merge execution
        id: ac-4
        then: all patch tensors are on CPU with no GPU tensor references remaining
        when: final merged patches are produced
      - given: peak GPU usage during a chunk
        id: ac-5
        then: actual usage does not exceed the estimate by more than 20 percent
        when: compared to compute_batch_size estimate
      - given: Model tensors flow through the execution pipeline (base_state, merged_state, cache, patches)
        id: ac-6
        then: Tensors are referenced not cloned unless dtype or device conversion requires a new allocation
          — no redundant .clone(), deepcopy, or identity .cpu().to() copies that would duplicate
          model-sized data in RAM
        when: Tensors are passed between pipeline stages
      - given: save_model=True in in-memory patch output mode
        id: ac-7
        then: tensors are streamed to disk one at a time (peak memory is +1 tensor, not +full model)
        when: writing checkpoint
      - given: save_model=True in in-memory patch output mode
        id: ac-8
        then: GPU models are offloaded and VRAM cache cleared
        when: save completes
      - given: system RAM is below a safe threshold
        id: ac-9
        then: pin_memory() is skipped and plain .to() is used instead
        when: chunked_evaluation transfers tensors to GPU
      - given: an exit node begins GPU evaluation
        id: ac-10
        then: if MemAvailable is below the estimated peak working set (base_state + largest chunk +
          merged_state accumulation), a RuntimeError is raised with a message naming the shortfall
          in MB
        when: available system RAM is estimated
      - given: a non-CUDA memory exception occurs during chunked evaluation
        id: ac-11
        then: gc.collect() and empty_cache() run, then a RuntimeError is re-raised with the original as
          __cause__
        when: the exception is caught
      - given: the incremental cache holds tensors and MemAvailable drops below a threshold
        id: ac-12
        then: the cache entry is evicted instead of stored
        when: cache write is attempted
      - given: GPU evaluation completes and results are in merged_state in in-memory patch output mode
        id: ac-13
        then: base_state is freed before save; state dict re-acquired fresh for save only
        when: save_model=True and save path is about to be written
      - given: The incremental cache stores merged_state tensors that are already resident in process memory
          (moved, not copied)
        id: ac-14
        then: The eviction threshold accounts for the fact that cache storage is a pointer transfer not a
          new allocation — eviction triggers only when MemAvailable is below a safety margin for the
          next execution new allocations, not a multiple of the already-resident cache size
        when: Cache write evaluates whether to evict
    tags: []
    requirements:
