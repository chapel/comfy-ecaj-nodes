    entries:
      - _ulid: 01KR4N6CA12RQXCTP8SHG35NM7
        author: Jacob Chapel
        body: "MUST-FIX: finalization status is emitted only after no-op diffusion publication has already
          completed. This path calls sink.finalize(...), which performs validation/fsync/atomic
          replace, and only then calls progress.finalize(). During the active validation/publication
          phase the last reported phase remains write_tensor, so @streaming-materialization-progress
          ac-finalization-status-visible is not satisfied for no-op diffusion saves. Move the phase
          entry before the long finalize/publish work, while preserving the rule that
          published/success is not reported until publication actually succeeds, and add behavioral
          coverage that observes the phase while finalize/pre_publish_check is active."
        created_at: 2026-05-08T20:41:47.585Z
      - _ulid: 01KR4NRZYAWK21HYE5C8N0RDE5
        author: "@claude"
        body: "Fixed in 34cffde. Split SavedModelProgress.finalize() into two operations: finalize() now
          only enters the 'finalize' phase and advances the bar (no longer marks published), and a
          new mark_published() sets the success flag. _execute_full_model_noop now calls
          progress.finalize() BEFORE sink.finalize, then progress.mark_published() only after
          sink.finalize returns. This makes the active validation/fsync/atomic-replace phase visible
          to users while preserving the rule that published is only reported on actual success.
          Added behavioral tests (TestExitNodeFinalizationOrder) that use a spy pre_publish_check —
          which runs inside sink.finalize between fsync and atomic replace — to assert phase ==
          'finalize' and published is False mid-flight, and a failure variant where
          pre_publish_check raises and published stays False."
        created_at: 2026-05-08T20:51:57.514Z
    kind: blocker
    resolved_at: 2026-05-08T20:52:11.661Z
    resolved_by: "@claude"
  - _ulid: 01KR4N6K43QMYNMY2F6HHQS2R9
    anchor:
