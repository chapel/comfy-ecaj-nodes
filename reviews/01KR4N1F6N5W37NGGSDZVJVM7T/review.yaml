    entries:
      - _ulid: 01KR4N6K43FFMJ4ETZHS8RKAB2
        author: Jacob Chapel
        body: "MUST-FIX: normal diffusion saved-model materialization has the same finalization-status
          ordering bug. The code calls sink.finalize(...), including validation/fsync/atomic
          replace, before progress.finalize(), so users do not get a post-write
          finalization/publication status while that phase is active. That misses
          @streaming-materialization-progress ac-finalization-status-visible for the normal merge
          save path. The fix should report entering finalization before sink.finalize starts, then
          only mark publication/success after sink.finalize returns; tests should prove this order
          with an instrumented sink or pre_publish_check."
        created_at: 2026-05-08T20:41:54.563Z
      - _ulid: 01KR4NS8EAQ7PVY726YFEDH4E4
        author: "@claude"
        body: "Fixed in 34cffde. Same ordering fix applied to _execute_diffusion_save: progress.finalize()
          is now called BEFORE sink.finalize (immediately after del base_state), and
          progress.mark_published() runs only after sink.finalize returns.
          test_diffusion_merge_save_phase_is_finalize_during_pre_publish_check observes phase ==
          'finalize' and published == False during pre_publish_check on the merge path;
          test_diffusion_merge_save_pre_publish_failure_keeps_published_false proves a
          pre_publish_check rejection on the merge path leaves published False, no leftover temp
          files, and no published artifact at the target path."
        created_at: 2026-05-08T20:52:06.218Z
