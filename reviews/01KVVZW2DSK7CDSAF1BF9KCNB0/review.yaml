    entries:
      - _ulid: 01KVW05M114PQA31TVMB5HC1JF
        author: Jacob Chapel
        body: "MUST-FIX: the public diffusers-style Krea 2 LoRA packages are not fully supported because the
          compatibility table does not map their timestep projection groups. The pinned Comfy-Org
          coolblue/darkbrush/plasmoid/warmpastel headers and krea retroanime header contain
          transformer.time_embed.linear_1, transformer.time_embed.linear_2, and
          transformer.time_mod_proj lora_A/B keys. _parse_krea2_lora_key returns None for those
          groups, and a local safetensors fixture with
          transformer.time_embed.linear_1.lora_A/B.weight makes Krea2Loader.load raise
          Krea2CompatibilityError for unsupported tensor groups. Impact: AC
          ac-supported-krea2-lora-packages-load is not met for those supported public packages;
          users still cannot apply them without manual rewriting/removal. Add explicit mappings for
          these public names to the Krea base timestep/projection weights (verify against the Comfy
          Krea state dict, likely tmlp.1, tmlp.3, and tproj.1) and add behavioral/header coverage so
          the full public family loads or fails only for genuinely incompatible groups."
        created_at: 2026-06-24T05:03:14.465Z
      - _ulid: 01KVW0HFCZNPS1W32F3MGX4400
        author: Jacob Chapel
        body: "Fixed in commit 13cb49fd: added exact mappings for public diffusers-style Krea 2 timestep
          groups transformer.time_embed.linear_1, transformer.time_embed.linear_2, and
          transformer.time_mod_proj to diffusion_model.tmlp.1.weight, diffusion_model.tmlp.3.weight,
          and diffusion_model.tproj.1.weight. Added behavioral safetensors coverage that loads those
          public keys, validates current recipe shapes, and emits standard DeltaSpecs."
        created_at: 2026-06-24T05:09:42.943Z
    kind: blocker
