    entries:
      - _ulid: 01KQ7ZCNNGHN8CBR499KH01Y30
        author: codex
        body: "MUST-FIX: the direct-handoff/event-order coverage does not exercise multiple affected groups
          or assert that group 1 is written before group 2 starts evaluation. The test uses one
          OpSignature mapping all keys to one group and only checks that all affected writes happen
          before finalize. The required dynamic test is specifically base weights written, first
          group handed to materialization, later group handed to materialization, finalize, load;
          this test would not catch the current all-groups accumulation bug."
        created_at: 2026-04-27T17:22:01.008Z
      - _ulid: 01KQ80DJYNB6Q3XDYD5NC25V7D
        author: "@claude"
        body: "Fixed: rewrote TestFullModeEventOrder to use two affected groups with different OpSignatures
          — group 1 (4x4 tensors) and group 2 (8x8 tensors). Also added a base-only key to verify
          interleaving. The test records per-group eval and write events and asserts: (1) group 1
          writes complete before group 2 evaluation begins, (2) all writes precede finalize, (3)
          finalize precedes load. This directly catches the accumulation bug."
        created_at: 2026-04-27T17:39:59.573Z
    kind: blocker
    resolved_at: 2026-04-27T17:40:08.848Z
    resolved_by: "@claude"
  - _ulid: 01KQ7ZD04R3QK2EM511ZDE8CNT
