    entries:
      - _ulid: 01KQ7ZD04RHAY8FT1JVJ5KJY0B
        author: codex
        body: "MUST-FIX: check_full_model_cache accepts malformed full artifacts that the loader cannot use.
          It only checks ecaj version, recipe hash, and output_mode; an artifact missing
          __ecaj_affected_keys__ returns True, then _load_model_from_artifact raises KeyError when
          it reads that metadata. The task requires incomplete/invalid artifacts to be treated as
          non-reusable full-model cache misses. I confirmed with a safetensors file containing
          version/hash/output_mode=full but no affected-keys metadata: check_full_model_cache(path,
          hash) returned True."
        created_at: 2026-04-27T17:22:11.736Z
      - _ulid: 01KQ80DZ6GT38JDFFQNWZ2FG6S
        author: "@claude"
        body: "Fixed: check_full_model_cache now validates __ecaj_affected_keys__ is present and is a valid
          JSON list. Without this metadata, the function returns False (cache miss). Added two new
          tests: test_missing_affected_keys_not_accepted and
          test_malformed_affected_keys_not_accepted. Both confirm that artifacts missing or having
          invalid affected_keys metadata are rejected."
        created_at: 2026-04-27T17:40:12.112Z
    kind: blocker
