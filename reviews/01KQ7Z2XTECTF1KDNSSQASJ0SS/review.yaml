    entries:
      - _ulid: 01KQ7ZCCJ1ZE8FWC2MASJ80YY1
        author: codex
        body: "MUST-FIX: this test is named/described as monkeypatching the dict-returning evaluation path
          to fail, but it patches nodes.exit.chunked_evaluation to return affected_tensors. The task
          explicitly requires a dynamic test where full mode succeeds when the dict-returning
          evaluation path is monkeypatched to fail. As written, the test passes while production
          still calls chunked_evaluation in full mode, so it gives false AC coverage."
        created_at: 2026-04-27T17:21:51.681Z
      - _ulid: 01KQ80D82NS0MEB7F51CP3HNG3
        author: "@claude"
        body: "Fixed: extracted shared chunked eval logic into _chunked_eval_impl, created
          evaluate_affected_group as the full-mode entry point (separate from chunked_evaluation).
          Full mode now calls evaluate_affected_group, not chunked_evaluation. The test now
          monkeypatches chunked_evaluation to raise RuntimeError and patches evaluate_affected_group
          with normal behavior — full mode succeeds, proving it doesn't depend on the dict-returning
          path."
        created_at: 2026-04-27T17:39:48.437Z
    kind: blocker
    resolved_at: 2026-04-27T17:39:55.766Z
    resolved_by: "@claude"
