    entries:
      - _ulid: 01KQ829Y9XYKAHD5V8SGNW4XV2
        author: Jacob Chapel
        body: "MUST-FIX: full saved model mode still materializes the entire artifact into process-resident
          patch tensors instead of returning a MODEL loaded through Comfy's model loading lifecycle.
          _load_model_from_artifact reads every safetensors key into full_state, then
          install_merged_patches stores those tensors as set patches on a clone. The submitted test
          at tests/test_full_model_streaming.py:727-783 confirms every key is retained in
          result.patches. Impact: the returned MODEL is not actually Comfy-owned loaded-artifact
          memory, and all full-model weights remain resident solely because Exit returned, violating
          ac-return-loaded-model and ac-comfy-owns-returned-model-memory."
        created_at: 2026-04-27T18:12:57.277Z
      - _ulid: 01KQ833FP9B1G4TCP7PG1F7J8V
        author: "@claude"
        body: "Fixed: _load_model_from_artifact no longer installs artifact weights as set patches. Instead,
          it deep-copies the model and loads artifact weights directly into the model's own state
          dict via _state_dict update. The returned model has zero set patches — all weights are
          model-owned (Comfy-managed memory). Added TestLoadedModelNoResidentPatches with two tests
          verifying no patches and original model independence. Updated test_cache_hit_skips_gpu and
          test_artifact_load_returns_full_model_weights to verify model_state_dict() values instead
          of patches."
        created_at: 2026-04-27T18:26:54.280Z
    kind: blocker
    resolved_at: 2026-04-27T18:27:06.682Z
    resolved_by: "@claude"
  - _ulid: 01KQ829YGB4DX060SM3TA9RE86
    anchor:
      type: code
      commit: 2564ca6e52b64b52693022dda5479761d0c66018
      line_end: 556
      line_start: 526
      path: nodes/exit.py
      side: head
    entries:
      - _ulid: 01KQ829YGBQDNPK6E4MFVW52WZ
        author: Jacob Chapel
        body: "MUST-FIX: RecipeBase full saved model mode ignores enable_cache=False for the in-memory
          incremental cache. This path skips the cache lookup when enable_cache is false, but never
          clears _incremental_cache before returning. I verified with a probe that a pre-populated
          sentinel cache entry remains after RecipeBase full mode with enable_cache=False. Impact:
          cache-disabled full-mode no-op workflows leave process-resident tensor cache payloads
          behind, violating the task requirement that enable_cache=False evicts in-memory cache
          entries."
        created_at: 2026-04-27T18:12:57.484Z
      - _ulid: 01KQ833JPTT1AGV5F1709R8FCW
        author: "@claude"
        body: "Fixed: _execute_full_model_noop now calls _incremental_cache.clear() when enable_cache=False,
          before the materialization path. Added TestNoopEnableCacheFalseEvicts test that
          pre-populates cache with a sentinel, runs RecipeBase full mode with enable_cache=False,
          and verifies cache is empty after."
        created_at: 2026-04-27T18:26:57.369Z
    kind: blocker
    resolved_at: 2026-04-27T18:27:08.806Z
    resolved_by: "@claude"
  - _ulid: 01KQ829YGD1PNRYKT974M91GM1
    anchor:
      type: code
      commit: 2564ca6e52b64b52693022dda5479761d0c66018
      line_end: 460
      line_start: 448
      path: lib/persistence.py
      side: head
    entries:
      - _ulid: 01KQ829YGDMJ8MBD5AWNFHK1NE
        author: Jacob Chapel
        body: "MUST-FIX: full-model cache validation does not prove the artifact is complete. After checking
          hash/mode and parseable affected-key metadata, this returns True without comparing the
          safetensors keys to the current model manifest or even to the affected-key list. I
          verified with a probe that a matching-hash full-mode artifact containing only
          {'only_one_key'} is accepted. Impact: incomplete or hand-written partial artifacts can
          become cache hits, violating ac-incomplete-write-not-reused and ac-complete-artifact."
        created_at: 2026-04-27T18:12:57.486Z
      - _ulid: 01KQ833NZZGPVRPPQEB733D7XK
        author: "@claude"
        body: "Fixed: check_full_model_cache now accepts an optional expected_keys parameter. When provided,
          the artifact's actual safetensors keys must exactly match the expected set — incomplete or
          extra-key artifacts are rejected. Both call sites in exit.py now pass
          expected_keys=set(base_state.keys()). Added TestIncompleteArtifactRejected with three
          tests: incomplete artifact rejected, complete artifact accepted, and extra-keys artifact
          rejected."
        created_at: 2026-04-27T18:27:00.735Z
    kind: blocker
    resolved_at: 2026-04-27T18:27:11.302Z
