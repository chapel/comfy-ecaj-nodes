      path: scripts/manual/real_comfy_checkpoint_validation.py
      side: head
    entries:
      - _ulid: 01KQCHJ0HVHE5N7PCWMC1DK9JF
        author: codex
        body: "MUST-FIX: submit_workflow marks a prompt successful as soon as /prompt returns a prompt_id;
          it never waits for /history completion for save, loader, downstream, or image-save
          execution. Comfy accepts prompts before nodes run, so runtime save/load/KSampler/SaveImage
          failures can still produce accepted=true, saved_artifact_classification=checkpoint, and
          failure categories of none. Evidence: a mocked _api_post_prompt returning only a prompt_id
          made submit_workflow return accepted=True without any history lookup. The harness must
          wait for completed execution/history and classify executed node errors before reporting
          workflow success."
        created_at: 2026-04-29T11:56:28.091Z
      - _ulid: 01KQCJ38CXX4JYNPJN8BRZBJ1Z
        author: "@claude"
        body: "Fixed: submit_workflow now polls /history/{prompt_id} via query_prompt_history after /prompt
          returns a prompt_id. It waits for execution completion and inspects status.status_str for
          errors. Runtime node errors (save failures, loader errors, KSampler crashes) detected via
          execution_error messages in history are reported as accepted=False with descriptive error
          strings. Added _extract_node_errors_from_history helper. New tests:
          TestSubmitWorkflowHistoryPolling (5 tests) and TestExtractNodeErrors (4 tests) cover
          successful execution, runtime node errors, execution timeout, and rejected prompts."
        created_at: 2026-04-29T12:05:53.181Z
    kind: blocker
    resolved_at: 2026-04-29T12:06:08.556Z
    resolved_by: "@claude"
  - _ulid: 01KQCHJ0VX0MJHRZRP3009XE57
    anchor:
      type: code
      commit: 5ec36f5610bab3aa744310ee394860fe589550b7
      line_end: 820
      line_start: 806
      path: scripts/manual/real_comfy_checkpoint_validation.py
      side: head
    entries:
      - _ulid: 01KQCHJ0VX3YGKN4Y1F190MJJY
        author: codex
        body: "MUST-FIX: when checkpoint save is rejected, loader_ckpt falls back to source_model, so the
          downstream workflow validates the original checkpoint instead of the saved artifact.
          Evidence: with checkpoint_save mocked rejected, run_validation still submitted
          downstream_ksampler with source.safetensors and reported loader/downstream accepted. The
          loader/downstream phase should not use source_model as a substitute for the saved
          artifact; it should skip or fail with the save failure recorded."
        created_at: 2026-04-29T11:56:28.414Z
      - _ulid: 01KQCJ3CJ2AN9PQ3EX3D43TK56
        author: "@claude"
        body: "Fixed: When checkpoint save is rejected (no saved_artifact_filename), loader/downstream
          workflows are now skipped entirely instead of falling back to source_model. The skip is
          recorded with accepted=False and error='skipped: checkpoint save failed, no artifact to
          validate'. Failure categories for loader and downstream are set to 'save' to indicate the
          root cause. Updated test_validation_with_rejected_save to verify downstream_ksampler is
          never submitted and both loader/downstream results contain 'skipped' in their error."
        created_at: 2026-04-29T12:05:57.442Z
    kind: blocker
    resolved_at: 2026-04-29T12:06:11.118Z
    resolved_by: "@claude"
  - _ulid: 01KQCHJ146JB76HVNWRX0F5HD8
    anchor:
      type: code
      commit: 5ec36f5610bab3aa744310ee394860fe589550b7
      line_end: 877
      line_start: 876
      path: scripts/manual/real_comfy_checkpoint_validation.py
      side: head
    entries:
      - _ulid: 01KQCHJ146TKW12MQM7Y81FDYE
        author: codex
        body: 'MUST-FIX: memory_mode is unconditionally recorded as none after the workflows.
          classify_failure can identify VRAM/OOM errors as memory_mode, but run_validation stores
          that under the per-workflow category and then still reports
          failure_categories["memory_mode"] = "none". Evidence: a mocked save error of "VRAM out of
          memory during save" produced {save: memory_mode, memory_mode: none}. This loses the
          distinct memory-mode failure category required by the task.'
        created_at: 2026-04-29T11:56:28.678Z
      - _ulid: 01KQCJ3GS7V5HZNBQCTXS8DD14
        author: "@claude"
        body: "Fixed: memory_mode failure category is now computed by scanning all per-workflow failure
          categories for entries classified as 'memory_mode'. If any workflow (e.g., save, loader,
          downstream) was classified as memory_mode failure by classify_failure, the top-level
          failure_categories['memory_mode'] records which workflows had the failure instead of
          unconditionally being 'none'. Added TestMemoryModeFailurePropagation with tests for both
          the propagation case (VRAM error on save → memory_mode contains 'save') and the no-failure
          case (memory_mode remains 'none')."
        created_at: 2026-04-29T12:06:01.767Z
    kind: blocker
    resolved_at: 2026-04-29T12:06:13.625Z
    resolved_by: "@claude"
