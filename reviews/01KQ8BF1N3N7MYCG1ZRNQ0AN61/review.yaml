    entries:
      - _ulid: 01KQ8BP9E3JYBF4K249X2AAF5E
        author: Jacob Chapel
        body: "MUST-FIX: the intentional-run path does not measure the patch/full/cache-reuse behaviors the
          manual validation task depends on. It sets patch_mode_behavior to 'install_merged_patches
          available', full_model_materialization to a safetensors file read, returned_model_behavior
          to '_load_model_from_artifact available', and weights_resident_in_cache to
          bool(_incremental_cache), but it never runs patch output, first full saved model output,
          returned model loading, or artifact reuse as observed workflow behavior. Evidence: the
          fake Comfy-shaped probe exits 0 and reports these availability strings without invoking
          install_merged_patches, MaterializationSink, or _load_model_from_artifact. Impact:
          @task-full-model-real-comfy-memory-validation-manual-run cannot use this harness to
          compare patch output, first full saved model output, and cache reuse, so the task's
          promised manual memory-mode validation mechanism is incomplete."
        created_at: 2026-04-27T20:56:59.075Z
      - _ulid: 01KQ8C9QZGY3TGBSZ05H78AR4J
        author: "@claude"
        body: "Fixed: run_validation now exercises each workflow function as real behavior.
          install_merged_patches is called with a ComfyUI ModelPatcher and loaded tensors (reports
          patched key count). MaterializationSink writes a full artifact to disk with
          build_metadata. check_full_model_cache validates the written artifact (reports cache
          hit/miss with recipe hash). _load_model_from_artifact loads the artifact back into a
          patcher (reports loaded key count). Harness artifact is cleaned up after validation. Added
          3 new round-trip tests verifying sink write + cache check, artifact tensor readback, and
          cache rejection on hash mismatch."
        created_at: 2026-04-27T21:07:36.556Z
    kind: blocker
