      path: scripts/manual/krea2_header_probe.py
      side: head
    entries:
      - _ulid: 01KXKWGVWY18RXH2T87VN3NYKF
        author: Hermes Reviewer
        body: "MUST-FIX — the header-only compatibility probe unconditionally skips every .alpha key, while
          Krea2Loader validates the alpha base path and rejects unsupported alpha groups.
          Independent synthetic evidence: a package containing one complete native LoKR pair plus
          unrelated.unsupported.alpha produced probe.errors == [] and no unsupported groups, but
          Krea2Loader.load raised Krea2CompatibilityError naming that tensor as unsupported. This
          makes the task-required header probe falsely certify a package that runtime
          complete-or-reject validation rejects. Mirror loader alpha validation in the probe and add
          a behavioral regression fixture."
        created_at: 2026-07-15T21:56:56.862Z
    kind: blocker
  - _ulid: 01KXKWGW4J1P82D47AFHHZ2324
    anchor:
      type: code
      commit: 699cf74c2128e814a551c2f9a41306acdb9e63b1
      line_end: 222
      line_start: 211
      path: scripts/manual/krea2_header_probe.py
      side: head
    entries:
      - _ulid: 01KXKWGW4KSDHA1P9SWHKJ108A
        author: Hermes Reviewer
        body: "MUST-FIX — the probe collapses all directions for a model key into one set and only accepts
          exactly {down,up} or exactly {lokr_w1,lokr_w2}; the loader keeps those supported families
          separately and applies both complete contributions. Independent synthetic evidence: one
          package with complete up/down and complete w1/w2 for the same Krea 2 weight loaded
          successfully, validated shape, and emitted standard+lokr DeltaSpecs, but
          inspect_lora_header reported the key incomplete and emitted both incomplete and
          no-supported errors. Preserve per-family completeness in the probe (or deliberately reject
          the shape in the loader/spec); the header and runtime compatibility decisions must agree,
          with a regression test."
        created_at: 2026-07-15T21:56:57.107Z
    kind: blocker
