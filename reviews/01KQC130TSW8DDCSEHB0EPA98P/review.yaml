    entries:
      - _ulid: 01KQC197PHB37DAJ6J1DTS0VAP
        author: Jacob Chapel
        body: "MUST-FIX: checkpoint component classification only checks that __ecaj_checkpoint_components__
          exists, not that it records a checkpoint artifact with companion components. I created a
          safetensors file with artifact_kind=checkpoint, matching hash/base/dependencies,
          non-internal tensor keys, and __ecaj_checkpoint_components__='false';
          check_checkpoint_cache returned True. That accepts metadata that explicitly does not say
          the artifact was written with checkpoint companion components, violating the checkpoint
          classification requirement and allowing an invalid cache hit."
        created_at: 2026-04-29T07:12:03.281Z
      - _ulid: 01KQC218PYQM0NBWXY568Q3H09
        author: "@claude"
        body: "Fixed: check_checkpoint_cache now compares stored_components against \"true\" instead of just
          checking for None. A file with __ecaj_checkpoint_components__='false' is now correctly
          rejected as a cache miss."
        created_at: 2026-04-29T07:25:10.750Z
    kind: blocker
    resolved_at: 2026-04-29T07:25:23.159Z
    resolved_by: "@claude"
  - _ulid: 01KQC19MWWMVTSVFZ9NRZDHGDN
    anchor:
      type: code
      commit: 0fa21eb64f1eac52047ca6f2549f2ffcf53f48c6
      line_end: 659
      line_start: 651
      path: lib/persistence.py
      side: head
    entries:
      - _ulid: 01KQC19MWWDE7PEXFKX8BAXBT5
        author: Jacob Chapel
        body: "MUST-FIX: checkpoint cache validation does not require the serialized recipe metadata
          (__ecaj_recipe__) before accepting a hit. I created a safetensors file with matching
          __ecaj_recipe_hash__, artifact_kind=checkpoint, checkpoint_components=true, matching
          base/dependencies, and non-internal tensor keys, but no __ecaj_recipe__;
          check_checkpoint_cache returned True. The task requires saved artifacts to include
          __ecaj_recipe__, and @saved-model-artifact-safety ac-missing-metadata-not-reused says
          files missing required saved-model metadata must not be reused."
        created_at: 2026-04-29T07:12:16.796Z
      - _ulid: 01KQC21B7CAWKB44PQMJCH91CT
        author: "@claude"
        body: "Fixed: check_checkpoint_cache now requires __ecaj_recipe__ to be present in metadata before
          proceeding with any other checks. Files missing __ecaj_recipe__ are immediately rejected
          as cache misses."
        created_at: 2026-04-29T07:25:13.324Z
    kind: blocker
    resolved_at: 2026-04-29T07:25:25.790Z
    resolved_by: "@claude"
  - _ulid: 01KQC1AEFS93RHY214A9QSN687
    anchor:
      type: code
      commit: 0fa21eb64f1eac52047ca6f2549f2ffcf53f48c6
      line_end: 792
      line_start: 784
      path: nodes/exit.py
      side: head
    entries:
      - _ulid: 01KQC1AEFS05RERYDD1KYA83M5
        author: Jacob Chapel
        body: "MUST-FIX: the non-checkpoint save path still omits the required artifact classification and
          cache identity metadata. For non-checkpoint RecipeMerge saves these arguments are passed
          as None, and the RecipeBase/no-op save path calls build_metadata without them at all;
          check_full_model_cache also accepts legacy full artifacts that lack
          __ecaj_artifact_kind__, __ecaj_base_identity__, and __ecaj_dependency_fingerprints__ when
          the hash and manifest match. That violates @exit-model-persistence ac-6/ac-4 and the task
          requirement that saved artifacts include requested artifact kind, base identity, and
          dependency fingerprints, while preserving manifest/header validation rather than replacing
          it."
        created_at: 2026-04-29T07:12:43.001Z
      - _ulid: 01KQC21ECWVYTTKBXNTJ6WE4J3
        author: "@claude"
        body: "Fixed: All save paths (checkpoint, non-checkpoint RecipeMerge, and RecipeBase/no-op) now
          write artifact_kind, base_identity, and dependency_fingerprints metadata. Non-checkpoint
          paths use artifact_kind='diffusion'. check_full_model_cache now accepts
          expected_artifact_kind, expected_base_identity, and expected_dependency_fingerprints
          keyword params and validates them when provided. Both RecipeMerge non-checkpoint and
          RecipeBase call sites pass these expected values."
        created_at: 2026-04-29T07:25:16.571Z
    kind: blocker
    resolved_at: 2026-04-29T07:25:28.110Z
    resolved_by: "@claude"
