    entries:
      - _ulid: 01KQC70EHEXHMC6W93ZFYJ6YD1
        author: Jacob Chapel
        body: "MUST-FIX: checkpoint-source classification ignores RecipeBase.checkpoint_components. WIDEN
          Entry stores CLIP/VAE on RecipeBase when the source comes from CheckpointLoaderSimple, but
          _recipe_has_checkpoint_components only returns true for checkpoint RecipeModel nodes. A
          normal checkpoint Entry + LoRA/Merge + Exit save_model recipe therefore routes as
          diffusion-only, uses check_full_model_cache/MaterializationSink, and publishes an internal
          artifact_kind=diffusion file instead of calling comfy.sd.save_checkpoint. I confirmed a
          RecipeBase(checkpoint_components=...) + RecipeLoRA merge returns False from this helper.
          This violates @checkpoint-loadable-saved-model-output
          ac-artifact-matches-source-model-kind and the task requirement not to publish
          internal-format artifacts for checkpoint-style saves."
        created_at: 2026-04-29T08:52:06.830Z
      - _ulid: 01KQC8BHWE4P206NYRQGKP0WRF
        author: "@claude"
        body: "Fixed: _recipe_has_checkpoint_components now checks RecipeBase.checkpoint_components (clip
          and vae present) in addition to RecipeModel source_dir=checkpoints. A checkpoint Entry +
          LoRA/Merge recipe now correctly routes through the checkpoint save path. Added 6 unit
          tests for the classification logic in TestRecipeHasCheckpointComponents."
        created_at: 2026-04-29T09:15:39.278Z
    kind: blocker
    resolved_at: 2026-04-29T09:15:53.091Z
    resolved_by: "@claude"
  - _ulid: 01KQC70S4YBZ3X6DM7MGHDRSBB
    anchor:
      type: code
      commit: bddfbc71a07578a396071075ca5ed286c5b24b71
      line_end: 851
      line_start: 846
      path: nodes/exit.py
      side: head
    entries:
      - _ulid: 01KQC70S4YJSHF5RAE648749K0
        author: Jacob Chapel
        body: "MUST-FIX: valid checkpoint cache hits return the wrong MODEL. On a checkpoint cache hit this
          path calls _load_model_from_artifact, but that loader only updates exact diffusion_model.*
          keys (or strips only the bare diffusion_model. prefix). Comfy checkpoint artifacts store
          merged diffusion under model.diffusion_model.* along with conditioner.* and
          first_stage_model.* keys, so the loader ignores the saved merged weights and returns a
          clone with the original base weights. I confirmed this with a safetensors containing
          model.diffusion_model.*, conditioner.*, and first_stage_model.*: the returned
          model_state_dict stayed identical to the original. This breaks cache reuse for checkpoint
          saves and violates @exit-model-persistence ac-3/ac-8 and
          @checkpoint-loadable-saved-model-output ac-downstream-return-remains-usable."
        created_at: 2026-04-29T08:52:17.694Z
      - _ulid: 01KQC8BMMXWRZXHVA95XYS50DC
        author: "@claude"
        body: "Fixed: _load_model_from_artifact now handles Comfy checkpoint-style keys
          (model.diffusion_model.*) by extracting diffusion weights from both the Comfy prefix and
          the internal diffusion_model.* prefix, then maps them back to the patcher's
          diffusion_model.* keys. Added tests verifying checkpoint artifact loading updates model
          weights correctly."
        created_at: 2026-04-29T09:15:42.109Z
    kind: blocker
    resolved_at: 2026-04-29T09:15:55.688Z
    resolved_by: "@claude"
  - _ulid: 01KQC712WBKPC6B585RT0Q6Q5C
    anchor:
      type: code
      commit: bddfbc71a07578a396071075ca5ed286c5b24b71
      line_end: 757
      line_start: 724
      path: nodes/exit.py
      side: head
    entries:
      - _ulid: 01KQC712WBWKGTKC803F7VK9GJ
        author: Jacob Chapel
        body: "MUST-FIX: base-only checkpoint saves still publish the old diffusion artifact. execute()
          sends a RecipeBase root with save_model=True to _execute_full_model_noop, and this path
          always validates/reuses expected_artifact_kind=diffusion and writes through
          MaterializationSink with artifact_kind=diffusion. A WIDEN Entry fed from
          CheckpointLoaderSimple can be a RecipeBase with checkpoint_components, so saving that
          checkpoint-style source produces a diffusion_model.* internal artifact instead of a
          checkpoint loadable with conditioning and VAE components. This violates
          @checkpoint-loadable-saved-model-output ac-artifact-matches-source-model-kind for the
          no-op checkpoint-source workflow."
        created_at: 2026-04-29T08:52:27.659Z
      - _ulid: 01KQC8BQSNW80R191EAS6HDXTP
        author: "@claude"
        body: "Fixed: _execute_full_model_noop now detects checkpoint-style RecipeBase via
          _recipe_has_checkpoint_components and routes through save_comfy_checkpoint with
          artifact_kind=checkpoint instead of MaterializationSink with artifact_kind=diffusion.
          Cache validation also uses check_checkpoint_cache for checkpoint noop saves. Added 3 tests
          covering noop checkpoint save, noop diffusion save, and noop checkpoint cache hit."
        created_at: 2026-04-29T09:15:45.333Z
    kind: blocker
