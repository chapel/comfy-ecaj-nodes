    entries:
      - _ulid: 01KRH8GVDZ9HGDR9CBEPFK3BHD
        author: Jacob Chapel
        body: "MUST-FIX: process/log memory observations are only collected when --repeat-cache-miss-runs is
          greater than zero. The task and @live-comfy-saved-output-validation
          ac-report-records-process-memory-points require that when an operator supplies explicit
          process-memory inputs for checkpoint validation, the report records per-run memory
          observations for before execution, save-time when available, and after WIDENExit returns.
          With --comfy-pid and --comfy-log-path supplied but the default repeat count, this branch
          skips run_repeated_cache_miss_runs entirely, does not read procfs or parse the log, and
          emits an empty repeat_cache_miss_run_reports plus a not-requested result. Evidence: I
          patched collect_process_memory_observation to raise, called run_validation(...,
          comfy_pid=12345, comfy_log_path='/tmp/comfy.log') with fake API dependencies, and no
          exception was raised; the report contained repeat reports: 0 and result: not-requested.
          The normal checkpoint-save run needs its own per-run memory record, or the CLI/report
          should otherwise require repeat runs before accepting those memory inputs."
        created_at: 2026-05-13T18:10:26.879Z
      - _ulid: 01KRH9BBJ53XRRYMCHWRSAVPRG
        author: "@claude"
        body: |-
          Fixed in d9a0c9a. The primary checkpoint save inside run_validation now records its own per-run memory observations independently of --repeat-cache-miss-runs.

          Approach:
          - Extracted begin_save_run_memory_observation and finalize_save_run_memory_observation helpers from the repeat loop so the same lifecycle (before-run snapshot, log offset capture, submit, after-save=unavailable, after-return snapshot, log segment parse) is reused for the primary save.
          - Renamed RepeatedCacheMissRunReport to CheckpointSaveRunReport (kept the old name as an alias) since the dataclass now serves both the primary save and the repeat series.
          - Added report.primary_checkpoint_save_run (always populated with the PRIMARY_CHECKPOINT_SAVE_IDENTITY identity). With --comfy-pid supplied: before-run and after-return procfs samples are recorded. With --comfy-log-path supplied: after-checkpoint-save and after-checkpoint-temp-model-release WIDEN labels are parsed. process_memory_after_save is always recorded as unavailable (same reason as before — submit_workflow is post-/history).

          Reviewer reproducer is now covered by TestRunValidationPrimarySaveMemory::test_primary_save_invokes_procfs_when_pid_supplied_zero_repeats: patching collect_process_memory_observation to raise when run_validation is called with comfy_pid=12345 and repeats=0 now triggers the raise via the primary save's before-run sample (asserted via captured labels and report.errors).
        created_at: 2026-05-13T18:24:55.365Z
    kind: blocker
    resolved_at: 2026-05-13T18:25:01.310Z
    resolved_by: "@claude"
