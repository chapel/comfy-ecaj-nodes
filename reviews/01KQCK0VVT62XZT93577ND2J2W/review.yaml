    entries:
      - _ulid: 01KQCK7PBY2JT2QE85ARFSMHXS
        author: Jacob Chapel
        body: "MUST-FIX: loader and downstream outcomes are not distinct. When the saved-artifact downstream
          workflow fails in KSampler, run_validation copies that same downstream failure into
          checkpoint_loader_result and classifies the loader category from it. Evidence: a mocked
          downstream result with error 'node_error(KSampler): KSampler inference failed' produces
          checkpoint_loader_result.accepted=False and failure_categories['loader']='downstream',
          even though the checkpoint loader was not the failing node. This violates the requirement
          to record loader and downstream workflow results and distinct failure categories for
          loader versus downstream failures."
        created_at: 2026-04-29T12:25:47.134Z
      - _ulid: 01KQCM1R0CM0J9SSG1XRM74V6X
        author: "@claude"
        body: "Fixed: loader and downstream outcomes are now distinct. Added _extract_failing_node_type() to
          parse the failing node class from node_error(NodeType) error strings. run_validation now
          uses this to correctly attribute failures: if CheckpointLoaderSimple fails, loader is
          marked failed and downstream is skipped; if any other node fails (KSampler, VAEDecode,
          etc.), the loader is marked accepted=True and only the downstream carries the failure.
          Added 9 new tests covering all cases (KSampler failure with loader accepted, loader
          failure with downstream skipped, VAEDecode failure with loader accepted, all-success case,
          and the helper itself). All 1570 tests pass."
        created_at: 2026-04-29T12:40:00.780Z
    kind: blocker
    resolved_at: 2026-04-29T12:40:06.715Z
    resolved_by: "@claude"
