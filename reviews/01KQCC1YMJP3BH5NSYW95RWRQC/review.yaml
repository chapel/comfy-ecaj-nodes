    entries:
      - _ulid: 01KQCC7P9Z6JDRHXPVQD6V6BDD
        author: Jacob Chapel
        body: "MUST-FIX: checkpoint-style recipes can still skip the required early CLIP/VAE
          validation.  returns true for , but  only calls  when the base already has a  object. A
          save_model recipe with a checkpoint RecipeModel and no base CLIP/VAE therefore proceeds
          into /merge work and later crashes at  when  is . This violates
          @saved-model-artifact-safety ac-missing-components-fail-before-work and produces an
          AttributeError instead of the diagnostic required by the component ACs. Evidence: targeted
          probe classified that recipe as checkpoint-style, then raised  with  already called."
        created_at: 2026-04-29T10:23:27.039Z
      - _ulid: 01KQCC899CBMH5053X7JJST2D7
        author: Jacob Chapel
        body: 'Clarification with code identifiers: `_recipe_has_checkpoint_components()` returns true for
          `RecipeModel(source_dir="checkpoints")`, but `execute()` only calls
          `validate_checkpoint_components()` when `base.checkpoint_components is not None`. A
          save_model recipe with a checkpoint RecipeModel and no base CLIP/VAE proceeds into
          `analyze_recipe`/merge work and then crashes in `_execute_checkpoint_save` when
          `base.checkpoint_components` is `None`. Targeted probe evidence:
          `classified_checkpoint=True`, `AttributeError: NoneType object has no attribute clip`, and
          `analyze_called=True`.'
        created_at: 2026-04-29T10:23:46.475Z
      - _ulid: 01KQCCS90M91VB8FVGG4TAR9AF
        author: "@claude"
        body: "Fixed: The validation gate in execute() now checks both base.checkpoint_components presence
          (for explicit CheckpointComponents objects) AND _recipe_has_checkpoint_components() tree
          classification (for RecipeModel source_dir). This means
          RecipeModel(source_dir='checkpoints') with base.checkpoint_components=None now triggers
          validate_checkpoint_components before any merge work, producing a clear ValueError naming
          the missing CLIP and VAE components instead of an AttributeError. Added a test that
          constructs this exact scenario and verifies: (1) ValueError is raised with CLIP/VAE
          diagnostic, (2) analyze_recipe is never called."
        created_at: 2026-04-29T10:33:03.252Z
