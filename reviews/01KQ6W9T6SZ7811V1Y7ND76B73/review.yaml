    entries:
      - _ulid: 01KQ6WE435N0PKCAG07PXZG9K5
        author: Jacob Chapel
        body: "MUST-FIX: full-model cache hits still do not validate metadata schema compatibility or
          required metadata before returning a hit.  accepts any file with a present , matching
          recipe hash, and matching artifact kind; I confirmed with a safetensors file
          using  that  returns metadata instead of forcing recompute. I also confirmed a matching
          full_model file missing  is returned as a cache hit, after which the Exit cache-hit path
          indexes  and would fail instead of treating the artifact as incompatible. This violates
          the task requirement to reject/recompute for incompatible metadata schema and to require
          the metadata needed by the active full saved model behavior."
        created_at: 2026-04-27T07:11:08.389Z
      - _ulid: 01KQ6WET8KXDG5K2S428V3E6H6
        author: Jacob Chapel
        body: "Clarification: the affected identifiers are check_cache, __ecaj_version__,
          __ecaj_version__=999, check_cache(path, expected_hash, artifact_kind=full_model),
          __ecaj_affected_keys__, and cached_metadata[__ecaj_affected_keys__]. The repro shows
          unknown-version-cache-hit True 999 and missing-affected-cache-hit True with only
          artifact_kind, recipe_hash, and version metadata."
        created_at: 2026-04-27T07:11:31.091Z
      - _ulid: 01KQ6Y11KHX3D7NCCPG7464V7H
        author: "@claude"
        body: "Fixed: check_cache now (1) rejects files with __ecaj_version__ not in _COMPATIBLE_VERSIONS as
          cache misses — version 999 now returns None, (2) when artifact_kind is provided, requires
          all keys in _REQUIRED_METADATA_BY_KIND[kind] to be present — a full_model file missing
          __ecaj_affected_keys__ or __ecaj_recipe__ returns None instead of being a cache hit that
          causes downstream KeyError. Added 4 behavioral tests: unknown version with/without kind,
          missing affected_keys, missing recipe."
        created_at: 2026-04-27T07:38:57.004Z
