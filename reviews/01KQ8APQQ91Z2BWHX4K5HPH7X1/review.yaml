        author: Jacob Chapel
        body: 'Clarification for shell-stripped tokens above: the failing import is from nodes.exit.
          nodes/exit.py uses relative imports such as from ..lib..., so importing it as top-level
          nodes.exit raises attempted relative import beyond top-level package. Evidence command
          created fake ComfyUI/comfy/model_management.py and a safetensors artifact, then
          run_validation returned errors=["import-error: attempted relative import beyond top-level
          package"].'
        created_at: 2026-04-27T20:42:32.703Z
      - _ulid: 01KQ8BCHW4J2KZ1E4H8PKW0KW5
        author: "@claude"
        body: "Fixed: Added _setup_package_bridge() that replicates the conftest.py _ecaj synthetic package
          and MetaPathFinder. This is called in run_validation after _setup_import_paths(), so
          nodes/exit.py relative imports (from ..lib.X) resolve correctly via _ecaj.nodes.exit →
          _ecaj.lib.X. The bridge is idempotent — it checks for _ecaj in sys.modules before
          installing. Added 3 tests: bridge idempotency, _ecaj root creation, and nodes.exit
          importability after bridge."
