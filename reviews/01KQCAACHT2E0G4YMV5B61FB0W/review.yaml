      - _ulid: 01KQCANPDW7652M8QV41N1XRAS
        author: Jacob Chapel
        body: 'MUST-FIX: checkpoint component validation now runs for every save_model request before the
          code classifies the recipe as checkpoint or diffusion. That makes the diffusion-only save
          path unreachable through execute, even though this patch keeps and tests
          _execute_diffusion_save by patching validate_checkpoint_components out. I confirmed with a
          zimage RecipeBase without checkpoint_components: WIDENExitNode.execute(...,
          save_model=True) raises "Checkpoint save_model requires CLIP and VAE components" before
          reaching the diffusion save path. This regresses the exit-model-persistence contract for
          truly diffusion-only artifacts and should be scoped to checkpoint-style saves only, or the
          recipe/source kind needs to be explicit enough to distinguish the two.'
        created_at: 2026-04-29T09:56:08.764Z
      - _ulid: 01KQCBR9ZM6EGWT46RGDRF92AX
        author: "@claude"
        body: "Fixed: guarded validate_checkpoint_components in execute() with 'if
          base.checkpoint_components is not None' so it only fires for checkpoint-style recipes
          (where the user wired CLIP/VAE to Entry). Diffusion-only recipes
          (checkpoint_components=None) now skip the validation and proceed through the diffusion
          save path. Updated 4 tests in test_checkpoint_components.py to use explicit
          CheckpointComponents(clip=None, vae=None) to correctly signal checkpoint intent while
          testing the missing-components AC."
        created_at: 2026-04-29T10:15:02.900Z
