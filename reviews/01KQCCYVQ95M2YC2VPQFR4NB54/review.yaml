    entries:
      - _ulid: 01KQCD52PEP0E76HMWBSFJEYZW
        author: Jacob Chapel
        body: "MUST-FIX: checkpoint cache validation does not prove the artifact contains the required Comfy
          checkpoint component content. After metadata checks, the only content guard is rejecting
          artifacts where every key is internal-only; a metadata-valid file with only a
          conditioner.* tensor is accepted as a checkpoint cache hit. I verified this by writing a
          safetensors file with matching __ecaj_artifact_kind__=checkpoint,
          __ecaj_checkpoint_components__=true, matching recipe/base/dependency metadata, and a
          single conditioner.only tensor; check_checkpoint_cache(path, 'h', 'b', deps) returned
          True. That violates the task requirement that checkpoint artifacts contain
          diffusion/model, conditioning/text encoder, and VAE/decode content and means a
          partial/corrupt ecaj artifact can skip recomputation and return a MODEL with missing
          merged diffusion weights. Add behavioral validation for representative checkpoint prefixes
          (for example model. or model.diffusion_model., conditioner., and first_stage_model.)
          before accepting checkpoint cache hits, and use the same validation before publishing the
          temp checkpoint artifact."
        created_at: 2026-04-29T10:39:29.998Z
      - _ulid: 01KQCDPFA1S1KB5VZKYY7Z1PMG
        author: "@claude"
        body: "Fixed: Added _has_checkpoint_component_prefixes() that requires at least one key for each
          checkpoint component group (diffusion via model./model.diffusion_model./diffusion_model.,
          conditioning via conditioner./cond_stage_model., and VAE via first_stage_model.). Applied
          in both check_checkpoint_cache (after internal-only check) and _classify_temp_artifact
          (before os.replace publication). Added 6 tests including the exact probe scenario
          (conditioner-only artifact). Updated mock side effects in existing tests to use realistic
          checkpoint tensors. All 1456 tests pass."
        created_at: 2026-04-29T10:48:59.962Z
    kind: blocker
