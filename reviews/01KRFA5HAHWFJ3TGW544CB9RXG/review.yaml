        author: Jacob Chapel
        body: The plan adds ac-failed-return-not-successful to @saved-model-artifact-safety but the exact
          spec-change list does not set that spec's implementation status to in_progress. Because
          this is a tightened existing implemented spec, leaving it implemented during the follow-up
          work would misrepresent the unimplemented new contract. Add @saved-model-artifact-safety
          to the status update list in the spec-update task.
        created_at: 2026-05-13T00:01:43.985Z
    kind: blocker
  - _ulid: 01KRFA7BK0F08QVRJ0FDCZCHNB
    anchor:
      type: structured
      field: testing
      ref: "@comfy-memory-manager-compatibility"
      section: tasks
    entries:
      - _ulid: 01KRFA7BK1BRSS56GV5950DQEK
        author: Jacob Chapel
        body: The cleanup-on-failure contract explicitly covers save, publication, and artifact reload
          failures, and the task How section says release must happen when artifact publication
          raises. The Testing section only lists save failure and artifact reload failure. A worker
          could satisfy the listed tests while still leaking the temporary checkpoint save payload
          if publication fails. Add a focused publication-failure release test, or split/adjust the
          AC so every named failure point has explicit coverage.
        created_at: 2026-05-13T00:01:44.033Z
    kind: blocker
