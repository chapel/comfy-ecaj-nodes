    entries:
      - _ulid: 01KXKZ03BP2PYTNQ6NGA1FZ65V
        author: Hermes Reviewer
        body: "MUST-FIX — standard LoRA rank must be positive in both the runtime loader and header probe. A
          safetensors package with complete 2D factors down=(0, 6) and up=(4, 0) satisfies the
          current inner-rank equality, so inspect_lora_header reports it supported with no errors,
          while Krea2Loader.load reaches `strength * alpha / rank` and raises an unclassified
          ZeroDivisionError. The same divergence persists when the malformed standard family is
          mixed with a valid full-factor LoKR family on the same mapped key. This violates
          complete-or-reject and header/runtime accept+reason parity. Evidence: fresh 45-case CPU
          differential sweep, 43 aligned and these two manifestations divergent. Reject zero rank as
          shape-incompatible before division and mirror that header-visible rule in the probe, with
          same-fixture regressions."
        created_at: 2026-07-15T22:40:13.174Z
    kind: blocker
