        author: Hermes Reviewer
        body: MUST-FIX — the new per-set LoKR accumulation path has no recipe-level proof. There are zero
          annotations for ac-chained-krea2-adapters-compose-additively and
          ac-branched-krea2-adapters-remain-isolated, and no Krea 2 LoKR test invokes analyze_recipe
          plus evaluation with two packages sharing a key. Add deterministic repeated-execution
          tests that prove same-set contributions add and distinct branch sets remain isolated at
          their configured strengths. Directly inspecting one loader set is insufficient for the
          ACs' recipe-analysis/evaluation contract.
