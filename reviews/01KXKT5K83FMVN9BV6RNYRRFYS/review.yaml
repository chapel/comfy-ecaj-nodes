      - _ulid: 01KXKT8NGJ6W3Q3MVHSCKZYQKX
        author: Hermes Reviewer
        body: "MUST-FIX — LoKR factors were added to loaded_bytes, but the task-required exact two-package
          accounting and cleanup proof was not added. The existing Krea2 cleanup test loads only a
          standard up/down package, checks merely loaded_bytes > 0, and has no
          @loader-memory-measurement ac-1/ac-3/ac-6 annotations. Add a LoKR test with two known
          packages that asserts the exact sum of every w1/w2 tensor's nbytes, then cleanup => 0
          bytes and no global/per-set affected keys. Impact: double-counting, omission, or stale
          LoKR storage can regress while all current tests remain green."
