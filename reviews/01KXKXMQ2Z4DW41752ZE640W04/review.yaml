    entries:
      - _ulid: 01KXKXYEP0W5DBDF99HDXPH019
        author: Hermes Reviewer
        body: "MUST-FIX — the header probe marks groups supported solely from complete suffix sets and never
          validates header shapes. This violates complete-or-reject/runtime parity: an independent
          16-fixture differential run found inspect_lora_header accepted five packages that
          Krea2Loader.load rejects (1D LoKR w1, 3D LoKR w2, 1D standard down, standard up/down rank
          mismatch, and a 2D direct bias). It also classifies non-scalar alpha as unsupported while
          runtime classifies it shape-incompatible. Impact: the preflight can report malformed
          packages compatible even though runtime later rejects them, and its reason category
          diverges. Add header-only dimension/rank/direct-shape checks (and a shape-error category)
          matching Krea2Loader, with same-fixture behavioral regressions; do not materialize
          payloads."
        created_at: 2026-07-15T22:21:50.656Z
    kind: blocker
