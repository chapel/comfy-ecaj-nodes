    entries:
      - _ulid: 01KQ8CRRMDJ9ASVV84J0YMRRQW
        author: Jacob Chapel
        body: "MUST-FIX: _HarnessModel only exposes diffusion_model, but real ComfyUI
          ModelPatcher.add_patches/model_state_dict call self.model.state_dict(). The intentional
          path passes _HarnessModel into ModelPatcher, so install_merged_patches and
          _load_model_from_artifact fail before validating patch-mode or returned-model behavior.
          Verified with a fake ModelPatcher matching the local ComfyUI contract: the report
          contained '_HarnessModel' object has no attribute 'state_dict'."
        created_at: 2026-04-27T21:15:48.749Z
      - _ulid: 01KQ8DA1W1M4VNZ55BEK5541DK
        author: "@claude"
        body: "Fixed: replaced bare torch.nn.Module with _HarnessDiffusionModel that exposes state_dict()
          and load_state_dict(). _HarnessModel now also implements state_dict() and
          load_state_dict() returning the full prefixed tensor dict, matching the contract that real
          ComfyUI ModelPatcher.clone() and model_state_dict() rely on."
        created_at: 2026-04-27T21:25:15.265Z
    kind: blocker
    resolved_at: 2026-04-27T21:25:22.330Z
