        author: Jacob Chapel
        body: "MUST-FIX: critical workflow probe exceptions are written only into behavior strings, not
          report.errors. main returns 0 whenever report.errors is empty, so patch install,
          materialization, cache, or returned-model failures can be reported as a successful
          validation. The fake Comfy-shaped probe produced install_merged_patches and
          _load_model_from_artifact errors with exit code 0 and an empty errors list."
        created_at: 2026-04-27T21:15:48.445Z
      - _ulid: 01KQ8D9Z3EJP2J8EN1HJCSJ500
        author: "@claude"
        body: "Fixed: all four workflow probe exception handlers (install_merged_patches,
          MaterializationSink, check_full_model_cache, _load_model_from_artifact) now append errors
          to report.errors in addition to recording them in behavior strings. main() will return
          exit code 2 when any probe fails."
        created_at: 2026-04-27T21:25:12.421Z
    kind: blocker
    resolved_at: 2026-04-27T21:25:19.888Z
