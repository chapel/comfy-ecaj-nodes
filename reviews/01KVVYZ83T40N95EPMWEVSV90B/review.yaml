    entries:
      - _ulid: 01KVVZ5N27HDMNAQQ5BH07HJBE
        author: Jacob Chapel
        body: "MUST-FIX: Krea2Loader records expected shapes as a union per model key, so validation accepts
          a mixed loaded set when any LoRA for that key matches the current base shape. I reproduced
          this with two synthetic Krea 2 LoRA files for diffusion_model.blocks.0.attn.wq.weight: set
          good had package delta shape (4, 3), set bad had package delta shape (5, 3), and the
          current recipe shape was (4, 3). validate_compatible_keys({key}, {key: (4, 3)}) passed
          because (4, 3) was in the union, but applying the bad set later failed in
          apply_lora_batch_gpu with a tensor-size RuntimeError. This violates
          ac-lora-compatibility-is-complete-or-rejected because a shape-incompatible group is not
          reported before merge execution. Validation needs to reject every loaded group/set whose
          expected package shape does not match the current recipe shape, not just require at least
          one expected shape to match."
        created_at: 2026-06-24T04:45:46.951Z
      - _ulid: 01KVVZKWDAX85KQ0TPD32YBWXX
        author: Jacob Chapel
        body: "Fixed in commit 4b493400: Krea2Loader no longer stores expected shapes as a per-key union.
          validate_compatible_keys now walks each loaded LoRA/direct delta entry by set and rejects
          any package delta shape that does not match the current recipe shape. Added a regression
          covering the mixed good/bad set reproduction from this review."
        created_at: 2026-06-24T04:53:33.226Z
    kind: blocker
