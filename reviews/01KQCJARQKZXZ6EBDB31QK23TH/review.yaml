    entries:
      - _ulid: 01KQCJGFFCB3P8RGCETJFDV8B6
        author: Jacob Chapel
        body: "MUST-FIX: memory-mode failures are still masked when the runtime error also names the failing
          workflow node. The classifier checks save/loader/downstream keywords before
          memory/vram/oom, so node_error(KSampler): OOM: cannot allocate returns downstream and
          node_error(WIDENExit): save_model failed: CUDA out of memory returns save. Because
          run_validation only populates the top-level memory_mode category from per-workflow
          classifications equal to memory_mode, these real OOM/VRAM failures are reported as
          memory_mode none. This violates ac-memory-mode-not-changed-for-success and the task
          requirement for distinct memory-mode failure categories. Evidence: a direct probe at this
          snapshot returned downstream for the KSampler OOM case, and a mocked run_validation with
          downstream_ksampler OOM produced scheduling none, save none, loader downstream, downstream
          downstream, cache none, memory_mode none."
        created_at: 2026-04-29T12:13:06.412Z
      - _ulid: 01KQCJW6FJHV9XG5886DTWXTSS
        author: "@claude"
        body: "Fixed: Moved the memory/VRAM/OOM keyword check in classify_failure() to run BEFORE
          workflow-stage-specific checks (save, loader, downstream, etc.). Memory exhaustion is an
          orthogonal failure dimension — when OOM occurs inside a KSampler or during save, the root
          cause is memory pressure, not a workflow-stage problem. The existing run_validation
          propagation logic (scanning per-workflow categories for 'memory_mode' values) was already
          correct but was never triggered because classify_failure never returned 'memory_mode' when
          node-context keywords were present. Added 4 new tests covering the exact reviewer
          scenarios: node_error(KSampler): OOM, node_error(WIDENExit): CUDA out of memory,
          node_error(CheckpointLoaderSimple): VRAM, and a full run_validation integration test
          proving memory_mode propagates from downstream OOM."
        created_at: 2026-04-29T12:19:30.418Z
    kind: blocker
