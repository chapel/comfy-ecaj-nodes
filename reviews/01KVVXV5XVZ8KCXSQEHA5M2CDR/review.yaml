  - _ulid: 01KVVY43366NFZQJ3W786D3BN0
    anchor:
      type: code
      commit: 0914a9d7fd96de80a60dd280463179286589439c
      line_end: 328
      line_start: 315
      path: lib/lora/krea2.py
      side: head
    entries:
      - _ulid: 01KVVY43365GNRN4N8E217WCRF
        author: Jacob Chapel
        body: "MUST-FIX: Krea 2 compatibility validation only checks that mapped keys exist, not that the
          loaded LoRA delta shape is compatible with the current recipe's base tensor shape. A
          package can map to an existing key and pass validate_compatible_keys, then fail later in
          apply_lora_batch_gpu with a generic tensor-size RuntimeError. Evidence: a fixture mapping
          to diffusion_model.blocks.0.attn.wq.weight with a 4x3 delta passed
          validate_compatible_keys({key}) against a recipe key set, then applying it to a 5x3 base
          tensor failed with 'The size of tensor a (5) must match the size of tensor b (4)'. The AC
          requires unsupported or shape-incompatible groups to be reported before merge execution
          publishes a result, with actionable incompatible-group diagnostics."
        created_at: 2026-06-24T04:27:27.206Z
      - _ulid: 01KVVYPC9ERSD4M8JAPFKN6Q45
        author: Jacob Chapel
        body: "Fixed in 9d0f3591: Krea2Loader records the expected delta shape for each loaded group, and
          Exit now passes current recipe key_shapes into validate_compatible_keys. Shape mismatches
          are rejected during preflight with the affected key, package delta shape, and current
          recipe shape before any batch apply runs. Added
          test_mapped_keys_must_match_current_recipe_shapes."
        created_at: 2026-06-24T04:37:26.446Z
    kind: blocker
    resolved_at: 2026-06-24T04:37:26.791Z
    resolved_by: Jacob Chapel
  - _ulid: 01KVVY43JA80DFV34T6WT6G6CF
    anchor:
      type: code
      commit: 0914a9d7fd96de80a60dd280463179286589439c
      line_end: 277
      line_start: 276
      path: lib/lora/krea2.py
      side: head
    entries:
      - _ulid: 01KVVY43JAAZAQJ1EGZVQBHVME
        author: Jacob Chapel
        body: "MUST-FIX: explicit Krea 2 LoRA alpha tensors are ignored after key normalization.
          alpha_values is stored under the raw LoRA base path (for example
          transformer.transformer_blocks.0.attn.to_q), but this lookup uses the normalized model key
          (diffusion_model.blocks.0.attn.wq.weight), so packages with .alpha apply at default rank
          scaling instead of their encoded alpha. Evidence: a safetensors fixture with rank=2 and
          transformer.transformer_blocks.0.attn.to_q.alpha=1.0 produced DeltaSpec.scale=1.0;
          expected strength * alpha / rank = 0.5. This changes LoRA contribution magnitude and
          violates stable/documented strength semantics."
        created_at: 2026-06-24T04:27:27.690Z
      - _ulid: 01KVVYPCZ6W5V3JDK86GSCFXVH
        author: Jacob Chapel
        body: "Fixed in 9d0f3591: .alpha tensors are normalized through the same Krea 2 base-path mapping as
          LoRA factor tensors and stored by normalized model key, so explicit alpha values now
          produce strength * alpha / rank scaling. Added
          test_explicit_alpha_uses_normalized_krea_key."
        created_at: 2026-06-24T04:37:27.142Z
    kind: blocker
    resolved_at: 2026-06-24T04:37:27.489Z
    resolved_by: Jacob Chapel
