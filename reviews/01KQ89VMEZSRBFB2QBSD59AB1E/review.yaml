      side: head
    entries:
      - _ulid: 01KQ89ZSMMZ9P5B1W3EAN23M77
        author: Jacob Chapel
        body: "MUST-FIX: the intentional-run path prepends the ComfyUI root to sys.path and then imports
          this project as nodes.exit/lib.*. A real ComfyUI root has a top-level nodes.py, so the
          Comfy module shadows this project package; my Comfy-shaped root probe produced
          import-error values for patch-mode, full materialization, artifact reuse, and
          returned-model behavior while main still exited 0. The harness therefore reports success
          without validating the required behavior."
        created_at: 2026-04-27T20:27:13.428Z
      - _ulid: 01KQ8AFX0EQFW0MFPHVXSYQE62
        author: "@claude"
        body: "Fixed: Added _setup_import_paths() that inserts the project root before the ComfyUI root on
          sys.path, preventing ComfyUI's nodes.py from shadowing the project's nodes/ package.
          Project modules (nodes.exit, lib.*) now resolve correctly even when a real ComfyUI root
          with nodes.py is present. Added tests verifying path ordering and idempotency."
        created_at: 2026-04-27T20:36:01.158Z
    kind: blocker
    resolved_at: 2026-04-27T20:36:09.465Z
    resolved_by: "@claude"
  - _ulid: 01KQ89ZSWHTK0Y0H5VEV6PW9AK
    anchor:
      type: code
      commit: afea787efe1c0a926a94ac97b416789f3af80b50
      line_end: 397
      line_start: 313
      path: scripts/manual/real_comfy_memory_validation.py
      side: head
    entries:
      - _ulid: 01KQ89ZSWHT44FBCHV8PV1FXWQ
        author: Jacob Chapel
        body: "MUST-FIX: run_validation never uses model_path to load or execute the explicit deterministic
          fixture/model input; it only copies the string into the report. As a result an intentional
          run can succeed with a nonexistent model and cannot actually validate first full saved
          model materialization, artifact cache-hit behavior, returned-model behavior, artifact
          reuse, or whether affected weights remain resident in Exit cache state."
        created_at: 2026-04-27T20:27:13.681Z
      - _ulid: 01KQ8AG00C9RRWYCC74VKVA7G0
        author: "@claude"
        body: "Fixed: run_validation now validates model_path exists before touching sys.path (returns error
          report if missing). When the file exists, it opens it via safetensors.safe_open to read
          actual tensor keys/shapes/dtypes, builds a manifest for check_full_model_cache, and
          reports real cache-hit results. A nonexistent model now produces an error rather than a
          successful report with empty fields."
        created_at: 2026-04-27T20:36:04.236Z
    kind: blocker
    resolved_at: 2026-04-27T20:36:11.751Z
    resolved_by: "@claude"
