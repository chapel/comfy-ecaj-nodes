    entries:
      - _ulid: 01KVW15VN8YNVBE35KNY04V672
        author: Jacob Chapel
        body: "MUST-FIX: the public diffusers-style Krea 2 timestep LoRA groups are mapped to non-existent
          base keys. The pinned Krea 2 style LoRA headers contain transformer.time_embed.linear_1
          and transformer.time_embed.linear_2, but the pinned Krea 2 base diffusion header exposes
          tmlp.0.weight and tmlp.2.weight, not tmlp.1.weight or tmlp.3.weight. With the current
          mapping, validate_compatible_keys rejects supported public style LoRAs before execution as
          missing diffusion_model.tmlp.1.weight and diffusion_model.tmlp.3.weight, so
          ac-supported-krea2-lora-packages-load is not satisfied for real public packages. Update
          these exact mappings and add a behavioral/header regression that compares them against the
          public base keyspace or an equivalent fixture using tmlp.0/2."
        created_at: 2026-06-24T05:20:50.856Z
      - _ulid: 01KVW1GN1TCPZVY9PPPSST8DBX
        author: Jacob Chapel
        body: "Fixed in commit c76513ad: transformer.time_embed.linear_1 now maps to
          diffusion_model.tmlp.0.weight and transformer.time_embed.linear_2 now maps to
          diffusion_model.tmlp.2.weight. The timestep projection regression now validates those
          public-base target keys and shapes while preserving transformer.time_mod_proj ->
          diffusion_model.tproj.1.weight."
        created_at: 2026-06-24T05:26:44.538Z
    kind: blocker
