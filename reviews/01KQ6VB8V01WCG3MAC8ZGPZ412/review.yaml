        author: Jacob Chapel
        body: "MUST-FIX: full saved model artifacts are still built with build_metadata(..., workflow_json)
          and no artifact_kind. Newly saved full-model outputs therefore omit
          __ecaj_artifact_kind__, so subsequent mode-aware cache checks cannot distinguish them from
          older or other ecaj artifacts. Pass artifact_kind='full_model' here and add/adjust an
          Exit-node behavioral test that asserts the materialization metadata contains it."
        created_at: 2026-04-27T06:53:55.041Z
      - _ulid: 01KQ6W6GSQ9HAM28NT7DYYEYN9
        author: "@claude"
        body: "Fixed: build_metadata at exit.py:686 now passes artifact_kind='full_model'. Added a new
          behavioral test (test_materialization_metadata_includes_artifact_kind) that asserts the
          metadata kwarg passed to CheckpointMaterializationSink contains
          __ecaj_artifact_kind__='full_model'."
