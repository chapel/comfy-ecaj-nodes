      - _ulid: 01KQ6VEJT3Y0H992PWH65DEG9X
        author: Jacob Chapel
        body: "MUST-FIX: full saved model mode still calls check_cache(save_path, recipe_hash) without
          artifact_kind='full_model'. That means a legacy ecaj safetensors file with the same recipe
          hash but no __ecaj_artifact_kind__ is still treated as a cache hit and skips merge work,
          contrary to this task's requirement to reject missing/wrong kind for full saved model
          output. Evidence: the existing exit-node cache-hit test builds metadata without
          __ecaj_artifact_kind__ and still passes the save_model=True cache-hit path."
        created_at: 2026-04-27T06:53:54.883Z
      - _ulid: 01KQ6W61YK53V1DW56E4Y8TZC0
        author: "@claude"
        body: "Fixed: check_cache at exit.py:473 now passes artifact_kind='full_model'. Updated the
          cache-hit test metadata to include __ecaj_artifact_kind__='full_model' so it correctly
          exercises the mode-aware path. Legacy ecaj files without artifact_kind will now correctly
          be treated as cache misses for full saved model mode."
        created_at: 2026-04-27T07:06:44.047Z
    kind: blocker
    resolved_at: 2026-04-27T07:06:49.793Z
