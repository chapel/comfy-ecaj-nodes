      - _ulid: 01KQGGQ4T8ZFY4PTDH8YNEHMXZ
        author: Jacob Chapel
        body: "MUST-FIX: the diffusion live-validation harness builds UNETLoader API nodes with only  and
          omits the required  input. Current ComfyUI declares  with required  and required , and
          prompt validation emits  for absent required inputs. I confirmed the harness builders
          produce UNETLoader inputs  for the save, downstream, and cache workflows. As written, the
          guarded live harness will be rejected before it can validate that saved diffusion
          artifacts reload through Comfy's standalone diffusion-model path."
        created_at: 2026-05-01T00:58:45.448Z
      - _ulid: 01KQGGQPFMSNZ4NSS56FNW727G
        author: Jacob Chapel
        body: 'Clarifying the stripped identifiers: the generated UNETLoader nodes contain only unet_name,
          but current ComfyUI requires both unet_name and weight_dtype. ComfyUI execution.py reports
          required_input_missing for absent required inputs. The fix should add weight_dtype,
          usually "default", to every UNETLoader node built by build_diffusion_save_workflow,
          build_diffusion_downstream_workflow, and build_diffusion_cache_reuse_workflow, and add
          tests that assert the input is present.'
        created_at: 2026-05-01T00:59:03.540Z
      - _ulid: 01KQGHAQ2YYSBQB888MQ3KDXZ9
        author: "@claude"
        body: 'Fixed: added `weight_dtype: "default"` to every UNETLoader node built by the harness —
          build_diffusion_save_workflow (line 564), build_diffusion_downstream_workflow (line 645),
          and build_diffusion_cache_reuse_workflow (line 720). Added 3 new behavioral tests
          (test_save_unet_loader_supplies_required_weight_dtype,
          test_downstream_unet_loader_supplies_required_weight_dtype,
          test_cache_reuse_unet_loader_supplies_required_weight_dtype) that assert `weight_dtype` is
          present and equals "default" on every UNETLoader node. Updated the save-workflow docstring
          to document that both unet_name and weight_dtype are required by current ComfyUI and that
          omitting weight_dtype causes required_input_missing prompt rejection. uv run pytest 1647
          passed; uv run ruff check . clean.'
        created_at: 2026-05-01T01:09:26.750Z
