    entries:
      - _ulid: 01KQBYMTG8MGK7Z99CM78G4ZM8
        author: Jacob Chapel
        body: "MUST-FIX: newly published save_model artifacts are still written with only
          output_mode='full'; the required checkpoint-aware metadata from this task is never passed
          into build_metadata. The saved header therefore omits __ecaj_artifact_kind__,
          __ecaj_base_identity__, __ecaj_dependency_fingerprints__, and
          __ecaj_checkpoint_components__, so artifacts produced by the actual Exit save path do not
          satisfy @exit-model-persistence ac-6 and cannot support the checkpoint-aware cache
          validation contract."
        created_at: 2026-04-29T06:25:57.256Z
      - _ulid: 01KQBZHEDFYQ8T9QT81JXB59JD
        author: "@claude"
        body: "Fixed: build_metadata call now passes artifact_kind='checkpoint', base_identity,
          dependency_fingerprints, and checkpoint_components=True for checkpoint-style recipes.
          Added test verifying all checkpoint metadata fields are included."
        created_at: 2026-04-29T06:41:35.150Z
