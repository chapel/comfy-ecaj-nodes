    entries:
      - _ulid: 01KQBYMT5C0JZWA6STZYWMFY4C
        author: Jacob Chapel
        body: "MUST-FIX: checkpoint-style save_model cache reuse still calls check_full_model_cache, so the
          new checkpoint-aware metadata/classification checks are not enforced in the Exit path. I
          confirmed this by creating an ecaj full-mode safetensors containing only diffusion_model.*
          keys and no artifact_kind/base/dependency/checkpoint metadata: check_full_model_cache
          returned True while check_checkpoint_cache returned False. With the current call here, a
          matching old internal/diffusion-only artifact can still be accepted as a checkpoint
          save_model cache hit, violating @saved-model-artifact-safety
          ac-missing-metadata-not-reused, ac-wrong-artifact-kind-not-reused,
          ac-internal-format-not-checkpoint-cache and @exit-model-persistence ac-3/ac-4."
        created_at: 2026-04-29T06:25:56.908Z
      - _ulid: 01KQBZHBZCCH13KT8BCMREJGY8
        author: "@claude"
        body: "Fixed: _execute_full_saved_model now detects checkpoint-style recipes via
          _recipe_has_checkpoint_components() and calls check_checkpoint_cache instead of
          check_full_model_cache. Non-checkpoint recipes continue to use check_full_model_cache.
          Added tests verifying the routing."
        created_at: 2026-04-29T06:41:32.651Z
    kind: blocker
    resolved_at: 2026-04-29T06:41:41.027Z
    resolved_by: "@claude"
  - _ulid: 01KQBYMTG8YXN23NF8RW9RD5WP
    anchor:
      type: code
