threads:
  - _ulid: 01KQBZYTRTPEG96Q5ZXJAQ5ZRK
    anchor:
      type: code
      commit: 58ee1cd21f036143cf551f1150523d0ed4e418c6
      line_end: 705
      line_start: 702
      path: nodes/exit.py
      side: head
    entries:
      - _ulid: 01KQBZYTRT291TB8C9WCFR6E2A
        author: Jacob Chapel
        body: "MUST-FIX: checkpoint cache validation is wired with the diffusion-only base manifest, so a
          checkpoint-style save cannot be reused. The caller passes base_manifest here, which only
          contains model_patcher.model_state_dict() keys. check_checkpoint_cache then rejects an
          all-diffusion artifact as internal-only, and a real checkpoint artifact with CLIP/VAE keys
          would fail the exact artifact_keys == expected_keys manifest check because those companion
          keys are absent from base_manifest. The writer below also opens the sink with a manifest
          built only from base_state, so the checkpoint metadata it writes describes an artifact
          that the checkpoint validator rejects on the next run. This violates
          @exit-model-persistence ac-3 and the task requirement that matching checkpoint artifact
          kind plus matching metadata are accepted as a cache hit."
        created_at: 2026-04-29T06:48:53.787Z
      - _ulid: 01KQC0SSJYY5QH08XQT0PHMGCA
        author: "@claude"
        body: "Fixed: check_checkpoint_cache is now called without expected_manifest. The base_manifest only
          reflects model_patcher.model_state_dict() keys and may not include companion component
          keys (CLIP, VAE). Checkpoint cache validation relies on metadata fields instead: recipe
          hash, artifact kind, base identity, dependency fingerprints, checkpoint component
          classification, and internal-only artifact rejection. Added test verifying
          check_checkpoint_cache is called without expected_manifest. Also added test verifying
          diffusion-only RecipeModel recipes route to check_full_model_cache."
        created_at: 2026-04-29T07:03:37.310Z
    kind: blocker
    resolved_at: 2026-04-29T07:03:45.354Z
    resolved_by: "@claude"
  - _ulid: 01KQBZZ53P4DG6E7YFWF377WGV
    anchor:
      type: code
      commit: 58ee1cd21f036143cf551f1150523d0ed4e418c6
      line_end: 420
      line_start: 419
      path: nodes/exit.py
      side: head
    entries:
      - _ulid: 01KQBZZ53PK2SJZMV4SX6KP770
        author: Jacob Chapel
        body: "MUST-FIX: _recipe_has_checkpoint_components treats every RecipeModel as checkpoint companion
          metadata, but the diffusion-model input node also emits
          RecipeModel(source_dir='diffusion_models'). Those diffusion-only model recipes are
          therefore routed through check_checkpoint_cache and stamped with
          artifact_kind='checkpoint' plus checkpoint_components=True, even though they are not
          checkpoint artifacts with companion components. That misclassifies diffusion-only
          artifacts and makes their save_model cache path a false miss under the new internal-only
          rejection, violating the artifact-kind classification contract in @exit-model-persistence
          ac-3/ac-4/ac-6."
        created_at: 2026-04-29T06:49:04.374Z
      - _ulid: 01KQC0SDYGMGGWX39BEGF6W6S9
        author: "@claude"
        body: 'Fixed: _recipe_has_checkpoint_components now checks node.source_dir == "checkpoints" instead
          of treating all RecipeModel nodes as checkpoint companions.
          RecipeModel(source_dir="diffusion_models") from the diffusion model input node is no
          longer misclassified as checkpoint-style. Added 3 tests: diffusion-model RecipeModel not
          detected as checkpoint, diffusion-model in Compose not detected, and mixed
          diffusion+checkpoint correctly detected.'
        created_at: 2026-04-29T07:03:25.391Z
    kind: blocker
    resolved_at: 2026-04-29T07:03:42.963Z
    resolved_by: "@claude"
