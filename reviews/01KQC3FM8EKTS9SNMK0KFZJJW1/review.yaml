    entries:
      - _ulid: 01KQC3T4T61TJ37WV1Y0D2KRWX
        author: Jacob Chapel
        body: "MUST-FIX: write-time serialization/file exceptions are not handled as abort/poison events.
          The code seeks and writes  without a try/except; when  is monkeypatched to
          raise,  propagates the error but leaves the same-directory  file behind and the writer is
          not marked aborted/poisoned. Impact: the required exception-during-write safety path is
          not implemented or behaviorally tested."
        created_at: 2026-04-29T07:56:14.535Z
      - _ulid: 01KQC3TR9VDX6WP7SA79YXGNRC
        author: Jacob Chapel
        body: 'Clarification: the failing block is self._file.seek(offset);
          self._file.write(_tensor_bytes(tensor)); self._written.add(name). Repro evidence:
          monkeypatching lib.incremental_writer._tensor_bytes to raise RuntimeError("serialization
          failed") makes write_tensor propagate the error while os.listdir(tmpdir) still contains a
          .ecaj_tmp_* file and the writer remains neither aborted nor poisoned.'
        created_at: 2026-04-29T07:56:34.491Z
      - _ulid: 01KQC48Y4RN41MQAQ2NV5QBMD2
        author: "@claude"
        body: "Fixed: wrapped the seek/write block in write_tensor with try/except. Any exception from
          _tensor_bytes or file I/O now poisons the writer (removing the temp file) and re-raises.
          Added two behavioral tests: one confirming monkeypatched _tensor_bytes RuntimeError
          poisons and cleans temp, another confirming a pre-existing artifact is preserved."
        created_at: 2026-04-29T08:04:19.224Z
    kind: blocker
    resolved_at: 2026-04-29T08:04:33.674Z
    resolved_by: "@claude"
  - _ulid: 01KQC3V18YGQXS0W89YJ4NZ2PW
