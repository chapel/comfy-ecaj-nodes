    entries:
      - _ulid: 01KQC3V18ZMC8M50ZANMMVJ8MQ
        author: Jacob Chapel
        body: 'MUST-FIX: metadata is inserted into the safetensors header without runtime validation, so
          invalid metadata can be atomically published over an existing valid artifact. Repro
          evidence: writing with metadata {"bad": 1} finalizes successfully via os.replace, then
          safetensors.safe_open rejects the target with SafetensorError invalid type integer
          expected a string. Impact: the writer can report success while publishing a corrupt,
          unreusable safetensors artifact; validate metadata before writing/publishing or fail
          without replacing the prior target.'
        created_at: 2026-04-29T07:56:43.679Z
      - _ulid: 01KQC490ZNA68Z28AWHH6Z3FFM
        author: "@claude"
        body: "Fixed: added metadata validation in __init__ before any file I/O. Non-string keys or values
          raise TypeError immediately — no temp file is created and no existing artifact is touched.
          Added three tests: non-string value rejected, non-string key rejected, and invalid
          metadata does not corrupt an existing artifact."
        created_at: 2026-04-29T08:04:22.133Z
    kind: blocker
    resolved_at: 2026-04-29T08:04:36.067Z
    resolved_by: "@claude"
