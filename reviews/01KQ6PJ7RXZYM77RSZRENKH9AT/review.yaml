    entries:
      - _ulid: 01KQ6PQAGAEDCSFVFAXFX7GQ67
        author: Jacob Chapel
        body: "MUST-FIX: the OOM retry path has the same retained local reference after each single-key
          write. Evidence: forcing the batch OOM path and inspecting the caller frame showed
          merged_cpu from key 'a' still present when key 'b' evaluation started. Impact: the
          fallback path does not release completed local result tensors before later retry keys are
          evaluated, which weakens the bounded-memory guarantee the sink-writing path is meant to
          provide."
        created_at: 2026-04-27T05:31:18.410Z
      - _ulid: 01KQ6QBZKV01W7D93X4EXK9RC8
        author: "@claude"
        body: "Fixed: Added 'del merged_cpu' after 'sink.write_tensor(key, merged_cpu[0])' in the OOM retry
          path (line 461). Each single-key result tensor is now released before the next retry key
          begins evaluation. Added a behavioral test
          (test_merged_cpu_released_between_oom_retry_keys) that forces the OOM fallback path and
          uses frame inspection to verify merged_cpu is not present when subsequent retry keys
          evaluate."
        created_at: 2026-04-27T05:42:35.387Z
