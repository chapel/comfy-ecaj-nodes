    entries:
      - _ulid: 01KQ87Q74QNC1PV6HZ743CPRPQ
        author: Jacob Chapel
        body: Full-mode streaming uses one global storage_dtype for every affected tensor even though the
          artifact manifest preserves per-key dtypes. I reproduced a mixed float32/float16 base
          where the float16 affected key is cast to float32 before sink.write_tensor, which raises a
          dtype mismatch and aborts materialization. This violates full saved model output for
          mixed-dtype/quantized artifacts; stream each key using its manifest/base dtype instead of
          the first tensor's dtype.
        created_at: 2026-04-27T19:47:35.191Z
      - _ulid: 01KQ88KY9WRY9FZAS0P7GV5KYH
        author: "@claude"
        body: "Fixed: streaming_evaluation_to_sink now uses per-key dtype from base_tensors
          (storage_dtype=None) instead of a single global storage_dtype. Each tensor retains its
          native base dtype, preserving mixed-dtype artifacts."
        created_at: 2026-04-27T20:03:16.408Z
    kind: blocker
    resolved_at: 2026-04-27T20:03:18.927Z
    resolved_by: "@claude"
  - _ulid: 01KQ87QF5S42BXN0J3F5622DEC
    anchor:
      type: code
      commit: f8b7da1d18952425fb301c4be36f403f9c61aa34
      line_end: 382
      line_start: 333
      path: nodes/exit.py
      side: head
    entries:
      - _ulid: 01KQ87QF5S5ZC655YR255PVXDH
        author: Jacob Chapel
        body: _load_model_from_artifact clones the incoming ModelPatcher and never clears inherited patches.
          Real ComfyUI ModelPatcher.clone() copies existing patches, so an Entry MODEL that already
          has LoRA/control patches returns with those patch-resident tensors still attached even
          though full mode is supposed to return the saved artifact model. This also means the
          result is not reliably loaded via Comfy's normal artifact-loading path; use a fresh loaded
          patcher or explicitly remove inherited patch state before returning.
        created_at: 2026-04-27T19:47:43.417Z
      - _ulid: 01KQ88M8XAT4GZFXBX7T6QN64X
        author: "@claude"
        body: "Fixed: _load_model_from_artifact now clears cloned.patches = {} after clone() to remove any
          inherited LoRA/control patches. The returned model has zero patches — weights come
          entirely from the artifact."
        created_at: 2026-04-27T20:03:27.274Z
    kind: blocker
    resolved_at: 2026-04-27T20:03:29.818Z
    resolved_by: "@claude"
  - _ulid: 01KQ87QRSY6QNR8PGCJ4FPKS3G
    anchor:
      type: code
      commit: f8b7da1d18952425fb301c4be36f403f9c61aa34
      line_end: 559
      line_start: 557
      path: nodes/exit.py
      side: head
    entries:
      - _ulid: 01KQ87QRSYHRT9KB5Z4B4RMXQA
        author: Jacob Chapel
        body: The RecipeBase full-mode no-op path reads model_state_dict() without first calling
          _unpatch_loaded_clones. Merge full mode does this before reading base_state, because
          loaded clones can cause model_state_dict() to include patched values. A RecipeBase-only
          full save after a patched clone is loaded can therefore materialize polluted patch weights
          as the complete 'base' artifact.
        created_at: 2026-04-27T19:47:53.278Z
      - _ulid: 01KQ88MKP399RZE887J3VXK0GH
        author: "@claude"
        body: "Fixed: _execute_full_model_noop now calls _unpatch_loaded_clones(model_patcher) before
          reading model_state_dict(), matching the merge full-mode path. Patched clone weights
          cannot pollute the base artifact."
        created_at: 2026-04-27T20:03:38.306Z
    kind: blocker
    resolved_at: 2026-04-27T20:03:40.457Z
    resolved_by: "@claude"
  - _ulid: 01KQ87R3RNY6HG0PCQ4JX4WRDS
    anchor:
