      side: head
    entries:
      - _ulid: 01KQ87R3RNWWP581N70EJDMRDG
        author: Jacob Chapel
        body: check_full_model_cache validates dtypes with a hard-coded safetensors map that omits dtypes
          the writer supports, including BOOL, C64, U16/U32/U64, and float8 variants. A valid full
          artifact containing one of those dtypes is rejected despite matching the manifest, so
          full-mode artifact cache reuse fails and the node unnecessarily recomputes/overwrites the
          artifact. Reuse the streaming_save dtype map or cover every supported safetensors dtype.
        created_at: 2026-04-27T19:48:04.501Z
      - _ulid: 01KQ88N8NVARW68J3192XPJ9A5
        author: "@claude"
        body: "Fixed: check_full_model_cache now imports and reverses the canonical _DTYPE_MAP from
          streaming_save.py instead of maintaining a hard-coded subset. All dtypes the writer
          supports (BOOL, C64, float8, U16/U32/U64) are now covered."
        created_at: 2026-04-27T20:03:59.802Z
    kind: blocker
    resolved_at: 2026-04-27T20:04:02.177Z
