        author: Jacob Chapel
        body: "Corrected detail after shell quoting stripped inline code: MaterializationSink.write_tensor
          does not validate the tensor against the manifest expected dtype, shape, or byte length
          before marking the key written. Runtime probe: a manifest declaring x as float32[2]
          accepted a one-element tensor, finalized successfully, loaded back as tensor([123., 0.]),
          and check_full_model_cache with expected_keys={x} returned True. This can produce a
          syntactically valid but incomplete or corrupt full artifact that is accepted as a later
          cache hit, violating complete-artifact and incomplete-write-not-reused requirements."
        created_at: 2026-04-27T18:34:52.502Z
      - _ulid: 01KQ848VXE1TBG55ZW86QYYVS9
