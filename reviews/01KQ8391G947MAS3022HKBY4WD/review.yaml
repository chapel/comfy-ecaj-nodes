        body: "Fixed: MaterializationSink.write_tensor now validates the tensor's dtype, shape, and byte
          length against the manifest before writing. Stored (dtype, shape, nbytes) per tensor in
          _tensor_specs during open(). Mismatches raise ValueError before the write, preventing
          corrupt artifacts from being finalized and accepted as cache hits. Added 3 new tests:
          dtype mismatch, shape mismatch, and dimension mismatch."
