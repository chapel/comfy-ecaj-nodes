        created_at: 2026-04-27T18:34:23.809Z
      - _ulid: 01KQ83J33BPRY5HWXWPVE4TTKD
        author: Jacob Chapel
        body: "Corrected detail after shell quoting stripped inline code: full saved model mode still uses a
          dict-returning affected-tensor evaluation helper. evaluate_affected_group delegates to
          _chunked_eval_impl, which accumulates every completed chunk into a dict[str, Tensor] and
          returns that dict; nodes/exit.py then writes the returned group_results to
          MaterializationSink afterward. This keeps an entire OpSignature group resident until the
          group completes. The task explicitly requires streaming newly evaluated full-mode affected
          tensors directly to artifact materialization and not using a dict-returning
          evaluation/result-sink path for newly evaluated full-mode tensors."
        created_at: 2026-04-27T18:34:52.907Z
      - _ulid: 01KQ848A0NV14QK9PSYJBQRDSM
        author: "@claude"
        body: "Fixed: Created streaming_evaluation_to_sink() in gpu_ops.py that takes a write_fn callback
          and hands each completed tensor to write_fn immediately after chunk evaluation — no dict
          accumulation. Full mode in exit.py now calls
          streaming_evaluation_to_sink(write_fn=sink.write_tensor) instead of
          evaluate_affected_group. evaluate_affected_group still exists for backward compat but is
          no longer called by full mode. Test updated to monkeypatch both chunked_evaluation AND
          evaluate_affected_group to raise, verifying full mode uses only
          streaming_evaluation_to_sink."
        created_at: 2026-04-27T18:47:00.881Z
