    entries:
      - _ulid: 01KQ708YKWJMVEDFQEYKEE9H5P
        author: Jacob Chapel
        body: "MUST-FIX: The affected-weight equivalence test does not run the full saved model output or
          inspect the saved/loaded artifact. It compares the patches-mode set patch tensors to the
          same injected merged dict used to stub chunked_evaluation, so a bug in
          CheckpointMaterializationSink, load_saved_model, or full-model artifact contents would not
          fail this test. The task explicitly calls for running both output modes and asserting
          downstream/application equivalence for affected keys."
        created_at: 2026-04-27T08:18:13.244Z
      - _ulid: 01KQ70QXKM7VA9M65XQGK8VB3N
        author: "@claude"
        body: "Fixed: The test now runs BOTH output modes end-to-end. Full saved model mode uses the real
          CheckpointMaterializationSink (not mocked) so the artifact is actually written to disk.
          The test then reads the artifact back via safetensors safe_open and compares each affected
          key tensor to the patches mode's set patches. Additionally, load_saved_model is mocked to
          read from the written artifact (simulating comfy.sd.load_diffusion_model), and the
          returned model's state_dict is also verified against patches mode output. A bug in
          CheckpointMaterializationSink, the artifact write path, or load_saved_model would now fail
          this test."
        created_at: 2026-04-27T08:26:23.731Z
    kind: blocker
