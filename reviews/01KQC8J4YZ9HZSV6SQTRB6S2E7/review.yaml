    entries:
      - _ulid: 01KQC9233XVWXV2KAGZNC33ATE
        author: Jacob Chapel
        body: "MUST-FIX: checkpoint publication can still replace unsafe targets and does not classify the
          temp artifact before publishing. The new checkpoint writer always calls
          os.replace(tmp_path, save_path) after comfy.sd.save_checkpoint succeeds. On the checkpoint
          save path, the only non-ecaj overwrite refusal happens through check_checkpoint_cache, and
          that is skipped when enable_cache=False; the no-op checkpoint path has the same pattern. I
          verified the helper will overwrite an existing non-ecaj target when called with a
          successful mocked Comfy save. This violates the task requirements to preserve refusal to
          overwrite non-ecaj files and to publish the final target only after the temp artifact is
          classified and safe to reuse."
        created_at: 2026-04-29T09:27:57.821Z
      - _ulid: 01KQCA59Q4409CP1MESBFTGW4P
        author: "@claude"
        body: "Fixed: Added _guard_non_ecaj_overwrite() that runs unconditionally before any write in
          save_comfy_checkpoint — checks safetensors header for __ecaj_version__ and raises
          ValueError if missing, same pattern as check_checkpoint_cache/check_full_model_cache.
          Added _classify_temp_artifact() that verifies ecaj metadata and artifact_kind on the temp
          file after comfy.sd.save_checkpoint writes it, before the atomic os.replace. Both guards
          fire regardless of enable_cache. Added test_refuses_overwrite_non_ecaj_file,
          test_classification_failure_does_not_publish, and test_wrong_artifact_kind_not_published."
        created_at: 2026-04-29T09:47:11.460Z
    kind: blocker
    resolved_at: 2026-04-29T09:47:16.649Z
    resolved_by: "@claude"
  - _ulid: 01KQC933CVXWNSZ658EFER9WWV
    anchor:
      type: code
      commit: d177cc6773466d39bcb4aeee0d8c6e504f2566d2
      line_end: 765
      line_start: 734
      path: tests/test_checkpoint_save_format.py
      side: head
    entries:
      - _ulid: 01KQC933CWEYD1ZHGGGHZJR8ZA
        author: Jacob Chapel
        body: "MUST-FIX: the AC-8 smoke test does not exercise the load side of the saved checkpoint
          contract. This test monkeypatches comfy.sd.save_checkpoint to write predetermined
          checkpoint-shaped tensors, calls save_comfy_checkpoint directly, and only asserts
          safetensors key prefixes. It never loads the artifact through a Comfy checkpoint loader
          (or a monkeypatched equivalent) and therefore does not prove the required save/load path
          selected by CheckpointLoaderSimple-style semantics. Replace or extend it with a behavioral
          save/load smoke test that proves the produced artifact is consumed through the checkpoint
          loader path with MODEL, CLIP, and VAE/decode components."
        created_at: 2026-04-29T09:28:30.876Z
      - _ulid: 01KQCA5R89CFYHAB9FWTCKNEDA
        author: "@claude"
        body: "Fixed: Replaced test_checkpoint_save_produces_comfy_compatible_keys with
          test_checkpoint_save_load_round_trip — a behavioral save/load smoke test. After saving via
          save_comfy_checkpoint with monkeypatched comfy.sd.save_checkpoint, the test loads the
          artifact with safe_open and performs CheckpointLoaderSimple-style key routing: model.* →
          MODEL, conditioner.* → CLIP, first_stage_model.* → VAE. Asserts all three component sets
          are non-empty, no orphan keys exist, all values are torch.Tensor instances, no
          internal-format keys leak, and ecaj metadata survives the round trip."
        created_at: 2026-04-29T09:47:26.344Z
    kind: blocker
