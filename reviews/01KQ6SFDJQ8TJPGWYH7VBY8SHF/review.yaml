    entries:
      - _ulid: 01KQ6SNXD33CXQ0CVKNN99NWT1
        author: Jacob Chapel
        body: "MUST-FIX: partial incremental recompute with save_model=True writes recomputed keys to the
          materialization artifact twice. In the partial-hit path, merged_state starts as the full
          cached affected state, including keys that batch_groups will recompute. This loop writes
          every cached key to CheckpointMaterializationSink before evaluation, then lines 768-773
          write the recomputed group_results for those same keys. IncrementalSafetensorsWriter
          rejects duplicates, so a valid partial recompute save aborts instead of publishing the
          full checkpoint. Evidence: actual sink probe raises RuntimeError: Duplicate key 'a':
          already written; the existing partial recompute test masks this by replacing
          CheckpointMaterializationSink with MagicMock."
        created_at: 2026-04-27T06:22:57.955Z
      - _ulid: 01KQ6TAMQ4Z18824PK1C78HD7P
        author: "@claude"
        body: "Fixed: The pre-write loop at nodes/exit.py:701 now builds a recompute_set from batch_groups
          values and skips any merged_state key that will be recomputed during evaluation. This
          prevents the duplicate key write that IncrementalSafetensorsWriter correctly rejects. Also
          replaced the MagicMock-based test with a real CheckpointMaterializationSink that exercises
          a true partial recompute scenario: only IN-block keys are recomputed while MID/OUT keys
          come from cache. The test reads back the resulting safetensors artifact and verifies both
          cached and recomputed values are correct."
        created_at: 2026-04-27T06:34:17.183Z
    kind: blocker
