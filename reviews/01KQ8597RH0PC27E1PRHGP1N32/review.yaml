    entries:
      - _ulid: 01KQ85GX51DDAZ2EYVJD2WQ6PS
        author: Jacob Chapel
        body: "MUST-FIX: full-mode cache validation treats an existing corrupt or non-ecaj file as a cache
          miss, so _execute_full_saved_model continues to MaterializationSink and atomically
          replaces that user file. This regresses @exit-model-persistence ac-9, which requires a
          clear error when model_name already points at a file not created by this node. I verified
          with a runtime probe that a pre-existing non-safetensors file at save_path is overwritten
          instead of raising."
        created_at: 2026-04-27T19:09:11.201Z
      - _ulid: 01KQ85ZHPMCRD03V6MEX47V34K
        author: "@claude"
        body: "Fixed: check_full_model_cache now raises ValueError for corrupt or non-ecaj files at
          save_path, matching check_cache (patch mode) behavior. When safe_open fails
          (corrupt/non-safetensors file), raises ValueError instead of returning False. When
          metadata is missing __ecaj_version__, also raises ValueError. Added 4 runtime tests:
          non-safetensors file raises, valid safetensors without ecaj raises, None metadata raises,
          and a full-mode runtime probe confirming non-ecaj file blocks execution and preserves the
          original file."
        created_at: 2026-04-27T19:17:10.996Z
    kind: blocker
    resolved_at: 2026-04-27T19:17:19.502Z
    resolved_by: "@claude"
  - _ulid: 01KQ85GXB7T83SSB04N8GXTBYB
    anchor:
      type: code
      commit: 94058d55e814c1b4aaaf2a5d087c86d1ad8d160d
      line_end: 475
      line_start: 469
      path: lib/persistence.py
      side: head
    entries:
      - _ulid: 01KQ85GXB7R9A1M4YYCVSDBJ7M
        author: Jacob Chapel
        body: "MUST-FIX: full-mode cache validation only compares the artifact key set. An artifact with the
          expected key names but wrong tensor shapes or dtypes is accepted as a reusable full-model
          cache hit, even though the task requires invalid artifacts to be non-reusable and
          @full-saved-model-output ac-complete-artifact requires the complete artifact to contain
          the required model weights with correct tensor specs. I verified check_full_model_cache
          returns True for a safetensors file containing key 'a' with shape (3, 3) when the base
          manifest would require a different shape."
        created_at: 2026-04-27T19:09:11.399Z
      - _ulid: 01KQ85ZMJ69YEQJCYNPN4WK3XR
        author: "@claude"
        body: "Fixed: check_full_model_cache now accepts expected_manifest (dict[str, tuple[dtype, shape]])
          instead of expected_keys (set[str]). The artifact's tensor shapes and dtypes are read via
          get_slice metadata and validated against the manifest. An artifact with correct key names
          but wrong shapes or dtypes is now rejected. Both callers in exit.py updated to pass the
          full manifest. Added 4 tests: wrong shape rejected, wrong dtype rejected, correct
          shape+dtype accepted, and multi-key partial shape mismatch rejected."
        created_at: 2026-04-27T19:17:13.926Z
    kind: blocker
    resolved_at: 2026-04-27T19:17:22.140Z
    resolved_by: "@claude"
