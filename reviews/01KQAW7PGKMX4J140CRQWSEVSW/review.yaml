      ref: "@saved-model-artifact-safety"
      section: acceptance_criteria
    entries:
      - _ulid: 01KQAW8X743ECZNH37Z3MCTFWS
        author: Jacob Chapel
        body: "MUST-FIX: This AC bundles two independently testable cache-rejection cases in the Given
          clause: missing required saved-model metadata and a different artifact kind. A task/test
          could satisfy the AC by covering only one case while leaving the other unimplemented.
          Split this into separate ACs, or rewrite it as one generalized behavioral contract and
          keep the concrete metadata/artifact-kind cases enumerated in task testing."
        created_at: 2026-04-28T20:25:15.236Z
    kind: blocker
  - _ulid: 01KQAW9AM3P1Q6NYM9DFYBNC66
    anchor:
      type: structured
      field: ac-missing-components-diagnostic
      ref: "@saved-model-artifact-safety"
      section: acceptance_criteria
    entries:
      - _ulid: 01KQAW9AM34J60N5E25BKBGN1B
        author: Jacob Chapel
        body: "MUST-FIX: The Then clause contains two separate assertions: the diagnostic names the missing
          requirement, and it explains how the workflow can provide it. Because these can pass or
          fail independently, split them into two ACs or replace the Then with a single observable
          standard such as 'the diagnostic is actionable for the missing checkpoint components' and
          put the exact content expectations in task tests."
        created_at: 2026-04-28T20:25:28.963Z
    kind: blocker
  - _ulid: 01KQAW9AM9N9HCVESC65Z7EHNV
    anchor:
      type: structured
      field: ac-report-captures-live-behavior
      ref: "@live-comfy-saved-output-validation"
      section: acceptance_criteria
    entries:
      - _ulid: 01KQAW9AM9RT8754P3D8VPAYW9
        author: Jacob Chapel
        body: "MUST-FIX: This AC's Then clause is a report schema checklist covering environment identity,
          workflow shape, save result, artifact classification, loader result, downstream result,
          and cache-reuse result. That is too many independently testable outcomes for one AC and
          makes task coverage ambiguous. Split it into smaller ACs, for example environment/memory
          identification, saved-artifact outcome, loader/downstream outcome, and cache-reuse
          outcome."
        created_at: 2026-04-28T20:25:28.969Z
    kind: blocker
  - _ulid: 01KQAW9AMTVQBYYZJZD6JMV618
    anchor:
      type: structured
      ref: "@task-checkpoint-save-component-sourcing"
      section: description
    entries:
      - _ulid: 01KQAW9AMTMM67ERSZMB4H5QP1
        author: Jacob Chapel
        body: "MUST-FIX: The task leaves the checkpoint component graph contract as an implementation-time
          choice ('Choose the least confusing graph contract ... optional inputs ... or equivalent
          source'). That contract changes the public node surface and determines whether SDXL-style
          checkpoint saves can be satisfied. Patch the plan so the contract is decided here, or
          split out an explicit design/decision task whose output is required before implementation
          tasks depend on it. A fresh agent should not have to infer this from prior chat or
          live-investigation context."
        created_at: 2026-04-28T20:25:28.986Z
    kind: blocker
  - _ulid: 01KQAW9Z83WGSHNBDMF19ZXDT6
    anchor:
      type: structured
      field: covers
      ref: "@task-checkpoint-save-spec-alignment"
      section: tasks
    entries:
      - _ulid: 01KQAW9Z83PXRD63QX80FES24T
        author: Jacob Chapel
        body: "MUST-FIX: The task explicitly says it will refine existing @full-saved-model-output ACs
          ac-complete-artifact and ac-return-loaded-model, and may update @exit-model-persistence if
          it still describes saved files broadly, but its Covers line only lists new-plan ACs. Add
          the existing ACs this task is responsible for updating/validating, or narrow the task so
          it no longer claims to modify those specs. Without that, the plan's coverage map is
          incomplete and a fresh agent cannot tell which existing behavioral contracts must be
          reconciled."
        created_at: 2026-04-28T20:25:50.083Z
    kind: blocker
  - _ulid: 01KQAWAHFA7TTPCA2AMYXHZFMF
    anchor:
      type: structured
      field: covers
      ref: "@task-checkpoint-save-live-validation-harness"
      section: tasks
    entries:
      - _ulid: 01KQAWAHFB73SW7MQX4ZJEXJ47
        author: Jacob Chapel
        body: "MUST-FIX: The Covers line claims @live-comfy-saved-output-validation
          ac-primitive-tests-do-not-substitute-for-live-validation, but this task mainly builds a
          guarded harness and mock/report tests. The AC is about release compatibility assessment
          not accepting primitive tests as sufficient. Move that coverage to the manual
          validation/state-reconciliation task, or add explicit release-assessment behavior to this
          task so the Covers claim is true."
        created_at: 2026-04-28T20:26:08.747Z
    kind: blocker
