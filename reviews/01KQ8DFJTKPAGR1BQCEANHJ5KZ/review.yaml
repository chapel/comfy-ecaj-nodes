    entries:
      - _ulid: 01KQ8DQXQXMVDWHQW1MYNJBS11
        author: Jacob Chapel
        body: "MUST-FIX: run_validation does not verify that --comfy-root actually contains or resolves the
          imported ComfyUI package before mutating sys.path and importing comfy. Evidence: with a
          valid safetensors model, an empty explicit root, and a different fake comfy package later
          on sys.path, run_validation reported memory_mode=RANDOM_COMFY_WAS_USED, had no errors, and
          executed the patch/cache probes. That violates the task requirement that the harness never
          auto-discover a random ComfyUI install; a typo in --comfy-root can validate the wrong
          installation."
        created_at: 2026-04-27T21:32:49.789Z
      - _ulid: 01KQ8E39GTHWC6KXKN77S30VG7
        author: "@claude"
        body: "Fixed: run_validation now validates --comfy-root contains comfy/__init__.py before mutating
          sys.path. A secondary defense-in-depth check uses importlib.util.find_spec to confirm the
          resolved comfy package is under the specified root, not an ambient installation. Added 3
          tests covering empty root, root without comfy/, and ambient comfy isolation."
        created_at: 2026-04-27T21:39:02.297Z
    kind: blocker
    resolved_at: 2026-04-27T21:39:08.825Z
