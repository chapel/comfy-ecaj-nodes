    content: "pyproject.toml already has [tool.comfy] with PublisherId = \"ecaj\", DisplayName = \"ECAJ
      Nodes\", Icon = \"\". Test should use tomllib (Python 3.11+) or tomli to parse pyproject.toml
      and assert the metadata fields. This prevents accidental breakage before publishing to the
      ComfyUI registry. The AC text: 'Given pyproject.toml defines [tool.comfy] metadata, When the
      package is published to the ComfyUI registry, Then it displays as ECAJ Nodes with publisher
      ecaj.'"
