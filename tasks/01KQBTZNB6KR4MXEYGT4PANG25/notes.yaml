  - _ulid: 01KQCJ4Q2NXJKH45EJXNBK6005
    content: "Fix cycle 2: addressed all 3 review blockers. (1) submit_workflow now polls /history for
      execution completion and detects runtime node errors — no longer marks prompts successful on
      /prompt acceptance alone. (2) When checkpoint save is rejected, loader/downstream are skipped
      entirely instead of falling back to source model. (3) memory_mode failure category now
      propagates from per-workflow classifications — VRAM/OOM errors surface correctly. Added 11 new
      tests (83 total). All pass, ruff clean, kspec validate passes."
