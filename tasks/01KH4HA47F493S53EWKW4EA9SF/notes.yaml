  - _ulid: 01KH5B4X0XS2GN6M3S54F4P0SM
    content: "Implemented batched pipeline executor primitives in lib/executor.py. Created OpSignature
      (frozen dataclass for parameter grouping by shape/affecting_sets), DeltaSpec (LoRA delta
      specification), compile_batch_groups (groups keys by OpSignature), compute_batch_size (targets
      70% free VRAM), apply_lora_batch_gpu (torch.bmm for standard LoRA, torch.kron for LoKr), and
      chunked_evaluation (OOM backoff wrapper with CPU result transfer and dtype matching). All 7
      ACs covered by 30 tests: AC-1 (grouping), AC-2 (bmm), AC-3 (70% VRAM), AC-4 (OOM backoff),
      AC-5 (CPU results), AC-6 (dtype matching), AC-7 (LoKr kron). All 215 tests pass, ruff clean."
    supersedes: null
