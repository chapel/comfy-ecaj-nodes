  - _ulid: 01KHKD9SJK2ESNYVE800YNWC5B
    content: >-
      ## Root Cause Analysis


      In nodes/exit.py line 409: `base_state = model_patcher.model_state_dict()` creates a FULL COPY
      of all model parameters (~5-6GB for SDXL). This copy is held from line 409 to line 662 —
      spanning entire GPU evaluation + save operation.


      ### Peak memory during save-enabled run (SDXL estimates):

      - ComfyUI model in memory: ~5-6 GB

      - base_state (full state_dict copy): ~5-6 GB

      - merged_state (affected keys): ~1-4 GB

      - _incremental_cache (persists between runs): ~1-4 GB

      - safetensors write buffer during atomic_save: ~5-6 GB transient

      - Total peak: ~18-24 GB CPU RAM


      ### Three sub-problems:

      1. base_state lifetime too long (exit.py:409-662) — Full state_dict copy held for entire
      execution. Only needed per-batch at line 617 and for save at line 648. Most keys never
      accessed during GPU eval.

      2. Save path materializes full model twice — base_state already holds full copy, then
      save_file() internally serializes it all. Overlay at line 648 is by-reference (cheap) but
      atomic_save still processes the full dict.

      3. _incremental_cache persists between executions (exit.py:89, 673-680) — Holds merged_state
      tensors by reference until next different fingerprint. Adds ~1-4GB baseline memory pressure.
