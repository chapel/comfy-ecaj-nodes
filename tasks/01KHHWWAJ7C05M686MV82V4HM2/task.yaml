title: "Fix exit node RAM exhaustion: 4 concurrent model copies cause OOM"
type: bug
description: "Four full-model copies live simultaneously in system RAM during execute(), causing
  ~30GB peak for SDXL (~7.6GB model). The incremental cache clone at exit.py:649 is unnecessary —
  install_merged_patches only reads tensors. Additionally base_state lingers too long. Fixes: (1)
  remove cache clone, (2) free base_state early, (3) selective state_dict copy. Target: peak RAM
  ~30GB → ~15GB."
