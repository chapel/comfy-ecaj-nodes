  - _ulid: 01KQCED1AZ645FRX9PSWCAXS9Z
    content: >-
      Approach: 

      1. Cache-miss checkpoint path (_execute_checkpoint_save) already returns merged_model directly
      — no change needed.

      2. Cache-hit checkpoint paths (in _execute_full_saved_model and _execute_full_model_noop)
      currently call _load_model_from_artifact which deep-copies cloned.model — replace with new
      _load_checkpoint_artifact function that uses
      comfy.sd.load_checkpoint_guess_config(output_vae=True, output_clip=True).

      3. New function _load_checkpoint_artifact(save_path) wraps Comfy loader with clear error on
      failure naming the checkpoint path.

      4. _load_model_from_artifact remains for diffusion-only saves (unchanged).

      5. No deepcopy on any checkpoint-style return path.


      Edge cases: 

      - Load failure on cache hit must raise, naming the path

      - save_model=False unchanged

      - Diffusion-only save unchanged


      Test plan: 6 tests per task description covering deepcopy prohibition, cache miss returns
      merged MODEL, cache hit invokes Comfy loader, loader failure diagnostics, downstream MODEL
      usability.
