  - _ulid: 01KR4ME7GMYBRJSVQAKJ39D0KE
    content: "Approach: New module lib/save_progress.py with SavedModelProgress class — wraps optional
      ProgressBar plus a small status-message log. Phases: prepare (1 unit), tensor writes
      (N=manifest size), finalize/publish (1 unit), reload (1 unit). Cache reuse uses a separate
      small (1-unit) progress instance and a 'cache_reuse' status. Failures emit a 'failure' status
      before re-raising; no 'published' status emitted unless atomic publish actually completed.
      Wire into both _execute_full_model_noop diffusion branch and _execute_diffusion_save: remove
      existing per-batch-group ProgressBar in _execute_diffusion_save and replace with
      whole-lifecycle progress; advance after every sink.write_tensor (base unaffected + streaming
      affected via _external_write wrapper). Tests use a Recording fake (records each (phase,
      advance, msg)) injected by patching ProgressBar to a fake or by injecting the progress object
      via dependency-injection on a private helper. Implementation: import the helper from
      nodes.exit so tests can patch nodes.exit.ProgressBar to a recording fake."
