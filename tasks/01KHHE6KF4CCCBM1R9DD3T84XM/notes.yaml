  - _ulid: 01KHHJ2FAKKM95W255Y4NY9RCP
    content: >-
      ## Spike Findings: ComfyUI CLIP clone and patch API


      ### Q1: Does ComfyUI CLIP use ModelPatcher internally?


      **YES.** The CLIP class (comfy/sd.py:103-163) wraps its cond_stage_model in a ModelPatcher at
      line 131:

          self.patcher = comfy.model_patcher.ModelPatcher(
              self.cond_stage_model, load_device=load_device, offload_device=offload_device)

      The patcher gets is_clip=True and hook_mode=MinVram.


      ### Q2: Can add_patches('set', ...) apply CLIP weight patches?


      **YES.** CLIP.add_patches() delegates directly to self.patcher.add_patches() (sd.py:179-180).
      The same ('set', (tensor,)) patch format used for diffusion models works identically for CLIP.
      ComfyUI's own load_lora_for_models() at sd.py:72-100 demonstrates this — it calls clip.clone()
      then clip.add_patches(loaded, strength_clip) with exactly the same pattern as model patching.


      ### Q3: What is the CLIP clone/patch API?


      CLIP.clone() (sd.py:165-174):

      - Creates a new CLIP(no_init=True)

      - Clones the patcher: n.patcher = self.patcher.clone()

      - SHARES cond_stage_model: n.cond_stage_model = self.cond_stage_model

      - Copies tokenizer, layer_idx, tokenizer_options


      This is the SAME clone-and-patch pattern as the diffusion model pipeline. Our
      install_merged_patches() in exit.py should work on CLIP objects with minimal adaptation:

      1. Call clip.clone() instead of model_patcher.clone()

      2. Call clip.add_patches(patches, strength_patch=1.0) instead of
      model_patcher.add_patches(...)

      3. Or equivalently, work at the patcher level: clip.patcher.clone() + patcher.add_patches()


      ### Q4: How to access CLIP state dict keys without loading weights to GPU?


      Use clip.patcher.model_state_dict() (model_patcher.py:604-612). This calls
      self.model.state_dict() under use_ejected() context, returning CPU tensors without GPU load.


      For SDXL, the cond_stage_model is SDXLClipModel (sdxl_clip.py:41-68) which has:

      - self.clip_l (SD1 CLIP, 12 layers): keys like
      clip_l.transformer.text_model.encoder.layers.{N}.{component}.weight

      - self.clip_g (CLIP-G, 32 layers): keys like
      clip_g.transformer.text_model.encoder.layers.{N}.{component}.weight


      The state_dict() returns ALL these keys together with their correct prefixes.


      ### Key Architecture Details


      **State dict key format (SDXL CLIP):**

      - clip_l.transformer.text_model.encoder.layers.{0-11}.self_attn.{q,k,v,out}_proj.{weight,bias}

      - clip_l.transformer.text_model.encoder.layers.{0-11}.mlp.fc{1,2}.{weight,bias}

      - clip_l.transformer.text_model.encoder.layers.{0-11}.layer_norm{1,2}.{weight,bias}

      - clip_l.transformer.text_model.embeddings.token_embedding.weight

      - clip_l.transformer.text_model.embeddings.position_embedding.weight

      - clip_l.transformer.text_model.final_layer_norm.{weight,bias}

      - (same pattern for clip_g with 32 layers instead of 12)


      **LoRA key mapping (from comfy/lora.py:97-156):**

      - lora_te1_text_model_encoder_layers_{N}_{component} →
      clip_l.transformer.text_model.encoder.layers.{N}.{component}.weight

      - lora_te2_text_model_encoder_layers_{N}_{component} →
      clip_g.transformer.text_model.encoder.layers.{N}.{component}.weight

      - Also supports generic format: text_encoders.{full_key_without_.weight} → {full_key}


      **_unpatch_loaded_clones concern:**

      The existing _unpatch_loaded_clones() in exit.py uses is_clone() which works across ALL
      ModelPatcher instances. A CLIP patcher clone would be detected correctly. However, the CLIP
      exit node should implement its own unpatch using the CLIP's patcher, not the diffusion model
      patcher.


      ### Impact on Implementation


      1. **CLIP Entry node**: Access keys via clip.patcher.model_state_dict().keys() — zero GPU cost

      2. **CLIP Exit node**: Clone clip, install merged patches via add_patches('set', ...), return
      CLIP — same pattern as diffusion Exit

      3. **CLIP LoRA loader**: Map lora_te1_ → clip_l, lora_te2_ → clip_g (confirmed by
      comfy/lora.py)

      4. **CLIP Model loader**: Include conditioner.embedders.* keys, normalize to clip_l/clip_g
      format

      5. **Arch detection**: Check for both clip_l and clip_g prefixes in state dict → SDXL
