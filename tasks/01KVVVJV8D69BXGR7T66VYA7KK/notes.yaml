notes:
  - _ulid: 01KVVX0E75AR5R9NKWGS1QC0V4
    content: "Approach: implement Krea2Loader as an explicit compatibility table for the pinned public
      families: diffusers-style transformer.* lora_A/B exports and native diffusion_model.*
      lora_down/up exports. Map transformer_blocks->blocks, text_fusion->txtfusion,
      to_q/to_k/to_v/to_gate/to_out.0->wq/wk/wv/gate/wo, ff->mlp, img_in->first, txt_in linear
      layers->txtmlp linear layers, and final_layer.linear->last.linear. Preserve compound
      text-fusion names during normalization. Add direct bias delta support for native .diff_b
      tensors so the public turbo LoRA can be complete instead of rejected. Edge cases: incomplete
      up/down pairs, rank mismatches, unsupported key families, missing mapped base keys for a
      current recipe, set scoping, cleanup, and deterministic strength scaling. Test plan: new
      CPU-safe Krea loader tests annotated for all @krea2-lora-package-compatibility ACs plus
      @krea2-architecture-support ac-krea2-recipe-uses-krea-compatible-paths; focused tests cover
      both package families, compound preservation, direct bias deltas, rejection diagnostics,
      keyspace validation, set scoping, and repeated strength determinism."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-24T04:07:58.949Z
  - _ulid: 01KVVXKHNSWZT0QTRZ3TTA28BG
    content: "Implemented Krea 2 LoRA package compatibility. Added Krea2Loader support for diffusers
      transformer lora_A/B exports and native diffusion_model lora_down/up exports, preserving Krea
      text-fusion compound names and mapping public package names to Krea base keys. Added direct
      .diff_b bias delta support through DeltaSpec kind=direct so the public native turbo package
      can apply completely. Added loader keyspace validation in Exit paths so mapped groups missing
      from the current base model fail before batching instead of being silently filtered out. Added
      CPU-safe tests for supported public families, compound-name preservation, native bias deltas,
      deterministic strength scaling, unsupported/incomplete/rank-mismatch diagnostics, base-key
      compatibility validation, registry routing, and cleanup. Gates: uv sync --extra dev completed;
      uv compileall lib nodes tests passed; CUDA_VISIBLE_DEVICES= uv run pytest passed (1749
      passed); uv run ruff check . passed; uv run ruff format --check . passed after applying
      required repo-wide formatter baseline; kspec validate --warnings-ok, --alignment
      --warnings-ok, and --completeness --warnings-ok passed with existing project warnings."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-24T04:18:25.082Z
