  - _ulid: 01KHCRP1YMEMWB6TAH6W9W1YAD
    content: >-
      Implementation notes (auto-generated from spec):


      Opt-in save/cache for merged model output. When enabled, the exit node saves the fully-merged
      model as safetensors adjacent to the base model directory. On subsequent runs, if the cached
      file metadata matches the current recipe configuration, the node loads directly from disk
      instead of recomputing the GPU merge pipeline. The saved file is a complete standalone model
      loadable by ComfyUI standard model loader. New inputs: save_model (boolean toggle, default
      off) and model_name (string filename).



      Acceptance Criteria:

      - ac-1: Given save_model toggle is disabled (default), when exit node executes, then behavior
      is unchanged from baseline — no file I/O

      - ac-2: Given save_model enabled and model_name provided, when exit node completes GPU merge,
      then fully-merged state dict saved as safetensors adjacent to base model using model_name

      - ac-3: Given cached safetensors exists at expected path, when exit node executes with
      save_model enabled and metadata matches current config, then model loaded from disk and GPU
      merge pipeline skipped entirely

      - ac-4: Given cached file exists but metadata does not match, when exit node executes with
      save_model enabled, then GPU merge pipeline runs and cached file is overwritten with new
      results

      - ac-5: Given save_model enabled and model_name is empty or not provided, when exit node
      validates inputs, then raises clear error requesting a model name

      - ac-6: Given a saved safetensors file, when examined for metadata, then header contains
      recipe identity hash, LoRA file stats (paths + mtime + size), base model identity, and
      per-block config

      - ac-7: Given LoRA files on disk have changed (different mtime or size), when exit node checks
      cache validity, then cache is invalidated and merge recomputes

      - ac-8: Given saved safetensors from exit node, when loaded by ComfyUI standard model loader,
      then functions as a complete standalone model

      - ac-9: Given file with model_name already exists but lacks ecaj metadata in safetensors
      header, when exit node attempts save or cache-check, then raises error indicating file was not
      created by this node and suggests a different model_name
    supersedes: null
