notes:
  - _ulid: 01KH731V18HTSHWJZQ7GT3KYVC
    content: "RuntimeError at gpu_ops.py:273 in chunked_evaluation: torch.stack fails because
      base_tensors dict contains a mix of CUDA and CPU tensors. The stack call is:
      torch.stack([base_tensors[k] for k in chunk_keys]). base_tensors comes from exit.py:386 as {k:
      base_state[k] for k in group_keys} where base_state = model_patcher.model_state_dict(). Some
      keys in model_state_dict() are returning GPU-resident tensors (likely from prior set patches
      or model loading) while others are CPU. Fix: ensure all tensors are moved to CPU before
      stacking, e.g. base_tensors[k].cpu(), or move uniformly to device before stack."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-11T19:32:34.984Z
  - _ulid: 01KH736YY6Q847Q475Q6VK7J46
    content: "Fix: added .cpu() call in chunked_evaluation torch.stack to normalize mixed-device tensors
      from model_state_dict(). Added regression test. All 494 tests pass, ruff clean."
