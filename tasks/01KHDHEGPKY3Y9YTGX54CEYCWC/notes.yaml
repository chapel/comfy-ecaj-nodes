  - _ulid: 01KHDJD446WM0Q3XQ2MS0244Y3
    content: "Implementation complete. Created lib/lora/qwen.py with QwenLoader class supporting 3 LoRA
      formats: diffusers (transformer.transformer_blocks.N.*.lora_A/B), A1111/kohya
      (lora_unet_transformer_blocks_N_*.lora_up/down), and LyCORIS
      (lycoris_transformer_blocks_N_*.lora_down/up). Key features: compound name preservation
      (_normalize_lycoris_key, _normalize_kohya_key), no QKV fusion (separate to_q/to_k/to_v),
      standard DeltaSpec production. Registered in LOADER_REGISTRY. Added 11 tests covering all 3
      ACs (ac-4, ac-5, ac-6). 741 tests pass, ruff clean."
