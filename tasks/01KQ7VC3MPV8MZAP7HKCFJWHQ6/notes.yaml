  - _ulid: 01KQ8DAHZHC8NRH8A4QG0KFHY2
    content: "Fix cycle 4: addressed both review blockers. (1) Replaced bare torch.nn.Module with
      _HarnessDiffusionModel exposing state_dict()/load_state_dict(), and _HarnessModel now also
      implements these methods returning full prefixed tensor dict — matching the real ComfyUI
      ModelPatcher.clone()/model_state_dict() contract. (2) All four workflow probe exception
      handlers now append errors to report.errors, so main() returns exit code 2 on probe failure
      instead of silently succeeding. All 36 harness tests pass, ruff clean. 3 pre-existing
      test_incremental_recompute failures remain (low system RAM, unrelated)."
