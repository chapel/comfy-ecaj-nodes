  - _ulid: 01KHFZ6TRRK494E8ZS05W7JS7Q
    content: >-
      Implementation approach:


      1. lib/persistence.py: Add compute_structural_fingerprint(node, base_identity, lora_stats) -
      serialize recipe tree excluding block_config fields, SHA-256 hash. Add
      collect_block_configs(node) - walk tree, return list of (path, BlockConfig|None) pairs.


      2. lib/block_classify.py: Add compute_changed_blocks(old_configs, new_configs, arch) - diff
      config lists, return (changed_blocks, changed_layer_types) or None for structural mismatch.
      Add filter_changed_keys(keys, changed_blocks, changed_layer_types, arch) - use classify_key()
      and classify_layer_type() to select affected keys.


      3. nodes/exit.py: Add _CacheEntry dataclass and _incremental_cache dict (LRU-1). Insert cache
      check after compile_plan() and before batch eval loop.


      4. Fingerprint: Use serialize_recipe() with strip_block_config=True flag.


      5. Tests: test_incremental_recompute.py covering all 16 ACs.
