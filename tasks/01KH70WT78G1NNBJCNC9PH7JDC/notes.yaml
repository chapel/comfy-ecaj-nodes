    content: "Both SDXL and Z-Image loaders now read .alpha keys from safetensors files (commits
      e1bcdd1). Existing test fixtures (sdxl_lora_with_alpha etc.) don't include .alpha tensor keys,
      so only the default alpha=rank path is covered. Need tests with safetensors files containing
      .alpha scalars where alpha \\!= rank to verify correct scale computation (scale = strength *
      alpha / rank). Files: lib/lora/sdxl.py, lib/lora/zimage.py, tests/test_sdxl_loader.py,
      tests/test_zimage_loader.py."
