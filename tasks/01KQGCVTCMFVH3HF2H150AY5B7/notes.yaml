  - _ulid: 01KQGEXBN4YERH0VGRKN1KDCH7
    content: >-
      Implementation complete:

      - Added _to_external_diffusion_key, _comfy_load_diffusion_model,
      _load_diffusion_model_artifact in nodes/exit.py.

      - Diffusion-only branch (cache-miss + cache-hit + no-op) writes external
      model.diffusion_model.* layout via MaterializationSink, returns MODEL through
      comfy.sd.load_diffusion_model.

      - Added __ecaj_source_model_kind__ metadata; check_full_model_cache now validates it
      (build_metadata too).

      - _classify_temp_artifact rejects diffusion artifacts containing internal-format
      diffusion_model.* keys; MaterializationSink.finalize accepts a pre_publish_check callback.

      - New tests (20) in test_diffusion_model_saved_output.py cover key layout for
      SDXL/Flux/Z-Image/Qwen-style state dicts, companion separation, source-kind metadata,
      cache-rejection on mismatched source/artifact kind, BF16 raw byte preservation across remap,
      comfy loader path on save + cache hit, and _classify_temp_artifact diffusion path.

      - Updated affected existing tests for new external key layout (test_full_model_streaming.py,
      test_incremental_recompute.py) and conftest stub for comfy.sd.load_diffusion_model.


      Verification: 1606 tests pass, ruff clean, kspec validate has only pre-existing warnings. No
      checkpoint-save behavior changes.


      Live-validation harness: this task does not extend the guarded harness in scripts/manual since
      checkpoint-save validation is already covered there; a follow-up task can add a
      diffusion-model-specific guarded harness (deferred to keep scope tight to spec ACs).
