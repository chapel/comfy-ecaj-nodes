  - _ulid: 01KQGDY83RF6Q2F9Q597SNNZDG
    content: >-
      Approach: existing diffusion-only save writes safetensors with bare `diffusion_model.*` keys,
      which Comfy's load_diffusion_model_state_dict cannot detect (it strips one of
      model.diffusion_model./model.model./net./model.). Plan:

      1. Diffusion-only save path remaps merged `diffusion_model.X` -> `model.diffusion_model.X`
      keys before passing manifest + writes to MaterializationSink (matches
      process_unet_state_dict_for_saving default).

      2. Add metadata fields:
         - __ecaj_artifact_kind__ stays 'diffusion'
         - __ecaj_source_model_kind__ = 'diffusion_model' (new) so cache hits validate source kind round-trip.
         - Pass through to build_metadata.
      3. _classify_temp_artifact verifies diffusion-model source key prefix
      (model.diffusion_model.*) for kind='diffusion'.

      4. New _load_diffusion_model_artifact calls comfy.sd.load_diffusion_model(save_path) for
      cache-hit + post-save returns; preserves Comfy-owned memory.

      5. check_full_model_cache learns expected_source_model_kind; manifest remap mirrors saved
      external keys.

      6. Existing ac-* (artifact-safety/round-trip, completeness, BF16 raw-byte) preserved.


      Test cases (annotated):

      - diffusion-only save writes model.diffusion_model.* keys (sdxl/flux/zimage/qwen synthetic
      state dicts).

      - diffusion save metadata stores source_model_kind='diffusion_model' and
      artifact_kind='diffusion'.

      - diffusion save calls comfy.sd.load_diffusion_model for returned MODEL (cache miss + cache
      hit).

      - cache hit rejects artifact with checkpoint source_model_kind.

      - cache hit rejects artifact with artifact_kind='checkpoint'.

      - companion-separation: artifact contains no conditioner./first_stage_model. keys.

      - noop diffusion path also writes external keys + uses load_diffusion_model.

      - BF16 streaming raw byte preservation still works after key remap.


      Keeps checkpoint branch (_execute_checkpoint_save / _noop checkpoint) unchanged. Existing
      tests using diffusion_model.* artifact keys must be updated to model.diffusion_model.* (only
      diffusion-only branch).
    supersedes: null
