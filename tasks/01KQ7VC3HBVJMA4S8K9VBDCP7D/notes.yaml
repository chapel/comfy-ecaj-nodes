  - _ulid: 01KQ7VYM5F037SG3P2678JY50T
    content: >-
      Approach: 


      Current state analysis:

      - exit.py has a single execute() method that runs the same dict-returning chunked_evaluation
      path for both patch and full saved model mode

      - After GPU eval, if save_model=True, it re-acquires base_state, overlays merged_state, and
      calls atomic_save

      - Cache hit path: checks recipe_hash against saved file, loads affected keys, installs as set
      patches

      - Incremental cache: stores merged_state (tensor payload) in _incremental_cache dict keyed by
      structural fingerprint

      - No concept of output mode routing yet - save_model is post-hoc save, not a distinct
      execution path


      Implementation plan:

      1. Add a chunked_evaluation_to_sink() function (or equivalent) that hands completed group
      results to a materialization sink instead of accumulating them in memory

      2. Create a MaterializationSink class wrapping the IncrementalSafetensorsWriter concept -
      writes base weights and affected tensors as they complete

      3. Split exit.py execute() into two paths:
         a. Patch mode (save_model=False): existing dict/in-memory path unchanged  
         b. Full saved model mode (save_model=True): streams to materialization sink, returns loaded model
      4. Full mode cache: validate artifact metadata/recipe_hash, load model from artifact, no
      tensor payload in _incremental_cache

      5. Full mode must NOT: accumulate affected tensors in merged_state, create _incremental_cache
      tensor entry, use dict-returning chunked_evaluation for new affected tensors


      Key design decisions:

      - MaterializationSink wraps streaming_save.py's IncrementalWriter concept but adds
      abort/finalize semantics

      - Base weights written via streaming from model_state_dict before affected eval

      - Affected tensors written per-group as evaluation completes  

      - Finalize does atomic rename, abort does cleanup

      - Returned MODEL loaded via safe_open from finalized artifact

      - Full-mode cache hit: check_cache() validates artifact, load_model() returns loaded MODEL -
      no tensor payload stored


      Edge cases:

      - No-op recipe: still create full artifact with all base weights, return loaded model

      - Failure mid-stream: abort sink, don't accept partial artifact as cache

      - enable_cache=False: evict existing entries (preserve existing behavior)

      - Dynamic VRAM: use comfy model_management APIs for returned model lifecycle without changing
      memory mode

      - Comfy cleanup APIs unavailable: graceful fallback


      Test plan: 15 required dynamic tests as specified in task, AC annotations for 3 specs
