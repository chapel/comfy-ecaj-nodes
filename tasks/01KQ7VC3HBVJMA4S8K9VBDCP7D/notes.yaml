      open/write_tensor/finalize/abort

      2. check_full_model_cache in persistence.py - mode-aware artifact cache validation  

      3. build_metadata output_mode parameter - distinguishes patch vs full artifacts

      4. exit.py split into _execute_patch_mode and _execute_full_saved_model

      5. Full mode: streams to MaterializationSink, no merged_state dict, no _incremental_cache
      tensor payload

      6. Full mode cache: artifact-backed via check_full_model_cache, not tensor-payload-backed

      7. Patch mode: completely unchanged behavior


      Test coverage: 28 behavioral tests covering all required dynamic tests from the task spec.
