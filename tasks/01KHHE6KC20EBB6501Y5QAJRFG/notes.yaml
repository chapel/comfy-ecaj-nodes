notes:
  - _ulid: 01KHHE6KC2HJVB9NGZ5FNREM8P
    content: |
      Implementation notes:

      Create lib/clip_model_loader.py with its own _normalize_key and
      _INCLUDED_PREFIXES (inverse of ModelLoader's _EXCLUDED_PREFIXES).
      Do NOT reuse ModelLoader._normalize_key -- they filter opposite key
      sets. Key mapping: conditioner.embedders.0.transformer.* -> clip_l.*,
      conditioner.embedders.1.transformer.* -> clip_g.*. Validate embedder
      count and ordering during init. Verify against real SDXL checkpoints.
    author: "@claude"
    created_at: 2026-02-15T19:59:49.634Z
  - _ulid: 01KHHPK9ZQEAHXQQ5R6BTJ6FVA
    content: "Implemented CLIPModelLoader: (1) Created lib/clip_model_loader.py with streaming loader
      for text encoder weights from checkpoints, (2) Key normalization maps
      conditioner.embedders.0.* to clip_l.* and embedders.1.* to clip_g.*, (3) Validates embedder
      structure, raises CLIPKeyMappingError for unexpected indices, (4) Excludes diffusion model and
      VAE keys (inverse of ModelLoader), (5) Uses safe_open() for memory-efficient access, (6)
      Reuses UnsupportedFormatError from model_loader. 35 new tests covering all 7 ACs. 1079 tests
      pass, ruff clean."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-15T22:26:34.615Z
