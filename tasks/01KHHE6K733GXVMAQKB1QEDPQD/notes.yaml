notes:
  - _ulid: 01KHHE6K73771E5DZFCKP7AWCG
    content: |
      Implementation notes:

      Create nodes/clip_exit.py. Mirrors exit.py structure but operates on
      CLIP state dict. Reuses recipe_eval, gpu_ops, per_block, batch_groups
      from lib/executor. The domain="clip" on RecipeBase drives loader and
      classifier selection via analyze_recipe(). Investigate ComfyUI CLIP
      clone/patch API early -- this is the highest risk area. If CLIP uses
      ModelPatcher internally, the same add_patches("set", ...) mechanism
      works. If not, may need load_sd() or direct state_dict manipulation.
      v1 does NOT include incremental block recompute for CLIP (add later).
    author: "@claude"
    created_at: 2026-02-15T19:59:49.475Z
  - _ulid: 01KHHJ6HH0HBW7HXDXJ99HGEFE
    content: "Spike findings (@investigate-clip-api): CLIP uses the same clone+patch pattern as
      diffusion models. clip.clone() clones the patcher and shares cond_stage_model.
      clip.add_patches(patches, strength) delegates to patcher.add_patches(). The ('set', (tensor,))
      format works identically. install_merged_patches() can be reused — operate on clip object
      directly (it exposes clone() and add_patches()). For _unpatch_loaded_clones: use clip.patcher
      (not diffusion model patcher) — is_clone() works correctly across all ModelPatcher instances."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-15T21:09:42.048Z
  - _ulid: 01KHHQ5RD14A51054RS2XDVGCS
    content: "Implemented WIDENCLIPExitNode: (1) Created nodes/clip_exit.py with GPU execution node for
      CLIP merging, (2) Accepts WIDEN_CLIP type, returns ComfyUI CLIP, (3) Uses analyze_recipe with
      domain='clip' for CLIP LoRA loader dispatch, (4) Uses CLIPModelLoader for checkpoint text
      encoder weights, (5) install_merged_clip_patches clones CLIP and applies patches via
      add_patches(), (6) IS_CHANGED returns hash based on LoRA/model file mtimes, (7) Progress
      reported via ComfyUI ProgressBar, (8) Validates recipe tree structure with domain='clip'
      requirement. 31 new tests covering all 9 ACs. 1110 tests pass, ruff clean."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-15T22:36:39.201Z
