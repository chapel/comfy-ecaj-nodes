notes:
  - _ulid: 01KH70H3S74RKEMHR14H61DSTH
    content: "Bug 1 (b779ed5): Set patch tuple format was wrong — ('set', tensor) instead of ('set',
      (tensor,)). ComfyUI calculate_weight does weight.copy_(v[0]), so with raw tensor v[0] indexed
      the first row instead of unpacking a 1-tuple. Every output neuron got identical values = full
      corruption. Fixed in nodes/exit.py:123, updated 5 test files."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-11T18:48:29.736Z
  - _ulid: 01KH70H6M68QE1AHER6PWQM3EZ
    content: "Bug 2 (e1bcdd1): Both SDXL and Z-Image loaders hardcoded alpha=rank, ignoring the .alpha
      tensor stored in LoRA safetensors files. Correct formula is scale=strength*alpha/rank. When
      alpha!=rank (common), delta magnitudes were wrong causing output divergence from merge-router
      reference. Fixed both loaders to read .alpha keys from file, defaulting to rank when absent."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-11T18:48:32.646Z
  - _ulid: 01KH70HCEQ2VGABQ743GQ59WR0
    content: "Verified: output now matches merge-router reference. Minor precision differences remain
      (expected — we compute in float32 end-to-end vs reference's bf16 between chain steps). All 493
      tests pass, ruff clean."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-11T18:48:38.615Z
