      - Report: reports/checkpoint_validation_report.json


      Artifact classification: checkpoint (confirmed via safetensors metadata)

      - Key prefixes: model (1680 keys), conditioner (587 keys), first_stage_model (248 keys)

      - Metadata: __ecaj_artifact_kind__=checkpoint, __ecaj_checkpoint_components__=true, arch=sdxl


