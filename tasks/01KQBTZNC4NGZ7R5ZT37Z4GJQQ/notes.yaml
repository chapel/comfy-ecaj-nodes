      1. Terminal Save: PASS — WIDENExit accepted as executable output (prompt 3db1de68)

      2. Checkpoint Save: PASS — artifact saved as checkpoint (prompt cc113972)

      3. Checkpoint Loader: PASS — saved artifact loaded through CheckpointLoaderSimple (prompt
