  - _ulid: 01KRH64SFWJ89R2K6Q09YVAP89
    content: "Implementation complete. exit.py: moved release into finally with None sentinel; reload
      runs after try/finally so its failure also propagates with temp already released. tests: added
      TestCheckpointSaveFailureReleasesTempPayload (save-fail, post-save-finalize-fail, reload-fail,
      pre-install-fail), TestCheckpointCacheMissSuccessOrder, TestClearTemporaryModelPatchPayloads
      (three attrs, missing attrs, no-clear attrs), TestReleaseTemporaryCheckpointModelOrder. Used
      contextlib.ExitStack for one test that exceeded Python's nested-with limit. pytest 1678
      passed. ruff clean. kspec validate --refs OK."
