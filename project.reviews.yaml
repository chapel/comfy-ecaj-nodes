            author: Jacob Chapel
            body: The finalize-failure test proves the test double cleaned itself up, not that production error
              handling cleans up after finalize fails. FailingFinalizeSink.finalize calls
              self.abort() before raising, so the outer WIDENExitNode exception path could stop
              aborting and this test would still pass. Make finalize raise without self-cleanup,
