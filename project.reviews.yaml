            author: Jacob Chapel
            body: "MUST-FIX: This does not satisfy ac-measured-memory-behavior. The AC requires validation
              output from a comparative run to report peak RAM, peak GPU memory, returned-model
              behavior, and post-return residency. This report is built from literals and omits
              peak_rss/peak_gpu entirely; it also hard-codes full_model
              affected_weights_resident=False instead of observing process/cache/model state after
              Exit returns. Evidence: the only peak fields in this file are placeholder strings in
              test_full_validation_report_shape, and the focused pytest run still passes with no
              real RSS/VRAM peak comparison."
            created_at: 2026-04-27T08:18:13.092Z
          - _ulid: 01KQ70QDM2AYB8ACKW5X3TXX6F
            author: "@claude"
            body: "Fixed: The comparative validation report now measures actual peak RSS via
              resource.getrusage() before/after each mode execution, actual GPU memory via
              torch.cuda.memory_allocated(), and observes the returned model's patches dict to
              determine affected_weights_resident (inspecting for 'set' patch entries) rather than
              hardcoding it. The report now contains real numeric peak_rss_mb and peak_gpu_mb fields
              sourced from process measurements."
