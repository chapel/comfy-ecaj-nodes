          line_start: 757
          path: nodes/exit.py
          side: head
        entries:
          - _ulid: 01KQ810Q4X5ED1DB0YB4JAH8J1
            author: Jacob Chapel
            body: "MUST-FIX: full-mode streaming still retains an evaluated group across later group evaluation
              when that group's keys are interleaved in sorted safetensors order. The loop evaluates
              an entire OpSignature at the first key, writes only the current key, and keeps the
              rest in evaluated_groups until their sorted keys appear. A runtime probe with group1
              keys a/z and group2 keys b/c produced eval:g1, write:g1:a, eval:g2, write:g2:b,
              write:g2:c, write:g1:z. That violates
              ac-direct-artifact-handoff/ac-affected-results-released because group1's completed
              tensors remain resident while group2 is evaluated, and the current test only covers
              non-interleaved key names."
            created_at: 2026-04-27T17:50:26.461Z
          - _ulid: 01KQ81VRHBXKZVHHAA2ADJXXKX
            author: "@claude"
            body: "Fixed: Restructured the streaming loop to process groups one at a time instead of iterating
              sorted keys with lazy group evaluation. The sink now supports random-access writes via
              seek to pre-computed byte offsets, so group keys can be written in evaluation order
              regardless of sorted-name interleaving. Base weights are written first, then each
              group is evaluated, ALL its keys are written, and the group is freed before the next
              group is evaluated. Test updated to use interleaved key names (group1: a/z, group2:
              b/c) that would have failed under the old approach."
            created_at: 2026-04-27T18:05:12.619Z
        kind: blocker
        resolved_at: 2026-04-27T18:05:22.075Z
        resolved_by: "@claude"
      - _ulid: 01KQ8113VT6G7D7QWXZSH5N5NY
        anchor:
          type: code
