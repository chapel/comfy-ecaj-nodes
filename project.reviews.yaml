            author: Jacob Chapel
            body: "MUST-FIX: _HarnessModel only exposes diffusion_model, but real ComfyUI
              ModelPatcher.add_patches/model_state_dict call self.model.state_dict(). The
              intentional path passes _HarnessModel into ModelPatcher, so install_merged_patches and
              _load_model_from_artifact fail before validating patch-mode or returned-model
              behavior. Verified with a fake ModelPatcher matching the local ComfyUI contract: the
              report contained '_HarnessModel' object has no attribute 'state_dict'."
            created_at: 2026-04-27T21:15:48.749Z
