            author: Jacob Chapel
            body: "Corrected detail after shell quoting stripped inline code: full saved model mode still uses a
              dict-returning affected-tensor evaluation helper. evaluate_affected_group delegates to
              _chunked_eval_impl, which accumulates every completed chunk into a dict[str, Tensor]
              and returns that dict; nodes/exit.py then writes the returned group_results to
              MaterializationSink afterward. This keeps an entire OpSignature group resident until
              the group completes. The task explicitly requires streaming newly evaluated full-mode
              affected tensors directly to artifact materialization and not using a dict-returning
              evaluation/result-sink path for newly evaluated full-mode tensors."
            created_at: 2026-04-27T18:34:52.907Z
