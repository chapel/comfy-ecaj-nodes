        entries:
          - _ulid: 01KQ85GXB7R9A1M4YYCVSDBJ7M
            author: Jacob Chapel
            body: "MUST-FIX: full-mode cache validation only compares the artifact key set. An artifact with the
              expected key names but wrong tensor shapes or dtypes is accepted as a reusable
              full-model cache hit, even though the task requires invalid artifacts to be
              non-reusable and @full-saved-model-output ac-complete-artifact requires the complete
              artifact to contain the required model weights with correct tensor specs. I verified
              check_full_model_cache returns True for a safetensors file containing key 'a' with
              shape (3, 3) when the base manifest would require a different shape."
            created_at: 2026-04-27T19:09:11.399Z
          - _ulid: 01KQ85ZMJ69YEQJCYNPN4WK3XR
            author: "@claude"
            body: "Fixed: check_full_model_cache now accepts expected_manifest (dict[str, tuple[dtype, shape]])
              instead of expected_keys (set[str]). The artifact's tensor shapes and dtypes are read
              via get_slice metadata and validated against the manifest. An artifact with correct
              key names but wrong shapes or dtypes is now rejected. Both callers in exit.py updated
              to pass the full manifest. Added 4 tests: wrong shape rejected, wrong dtype rejected,
              correct shape+dtype accepted, and multi-key partial shape mismatch rejected."
            created_at: 2026-04-27T19:17:13.926Z
        kind: blocker
        resolved_at: 2026-04-27T19:17:22.140Z
        resolved_by: "@claude"
