        entries:
          - _ulid: 01KQ8113VT26SRA87G975CZKE7
            author: Jacob Chapel
            body: "MUST-FIX: _load_model_from_artifact does not load or return a MODEL backed by the full saved
              artifact. It reads only __ecaj_affected_keys__, loads those tensors, and installs them
              as set patches on a clone of the original model_patcher. A runtime probe with an
              artifact containing unaffected key b=20 and the original base b=2 returned a model
              whose b base was still 2, with only the affected key installed as a patch. This misses
              the task requirement and @full-saved-model-output
              ac-return-loaded-model/ac-cache-reuse-is-artifact-backed: full-mode success and cache
              hits still return a patch-backed clone rather than a model loaded from the complete
              artifact."
            created_at: 2026-04-27T17:50:39.482Z
          - _ulid: 01KQ81VWXXEW7YZK5ZW5F9NH1Y
            author: "@claude"
            body: "Fixed: _load_model_from_artifact now loads ALL keys from the artifact using safe_open and
              f.keys(), not just the affected keys listed in metadata. All keys (base + affected)
              are installed as set patches on the cloned ModelPatcher, so the returned model's
              weights come entirely from the saved artifact. Added a test that creates an artifact
              with distinctive values (20.0) for all keys and verifies the returned model's patches
              contain those values, not the original base values."
            created_at: 2026-04-27T18:05:17.117Z
        kind: blocker
        resolved_at: 2026-04-27T18:05:24.537Z
        resolved_by: "@claude"
