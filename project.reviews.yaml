            author: "@claude"
            body: "Fixed: all four workflow probe exception handlers (install_merged_patches,
              MaterializationSink, check_full_model_cache, _load_model_from_artifact) now append
              errors to report.errors in addition to recording them in behavior strings. main() will
              return exit code 2 when any probe fails."
