          - _ulid: 01KQ70QXKM7VA9M65XQGK8VB3N
            author: "@claude"
            body: "Fixed: The test now runs BOTH output modes end-to-end. Full saved model mode uses the real
              CheckpointMaterializationSink (not mocked) so the artifact is actually written to
              disk. The test then reads the artifact back via safetensors safe_open and compares
              each affected key tensor to the patches mode's set patches. Additionally,
              load_saved_model is mocked to read from the written artifact (simulating
              comfy.sd.load_diffusion_model), and the returned model's state_dict is also verified
              against patches mode output. A bug in CheckpointMaterializationSink, the artifact
              write path, or load_saved_model would now fail this test."
