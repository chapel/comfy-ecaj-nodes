              materialization, cache, or returned-model failures can be reported as a successful
              validation. The fake Comfy-shaped probe produced install_merged_patches and
              _load_model_from_artifact errors with exit code 0 and an empty errors list."
            created_at: 2026-04-27T21:15:48.445Z
