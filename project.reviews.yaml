        entries:
          - _ulid: 01KQ6MYYHJ6YPV2FN6JY3MAQYM
            author: Jacob Chapel
            body: "MUST-FIX: The new MergeResultSink is never used by the merge execution path. Exit still calls
              chunked_evaluation(), receives a per-group dict, and merges every group into
              merged_state; the save path later iterates merged_state only after all groups have
              completed. That means full saved model mode still requires all affected weights to
              remain resident until later groups finish, so @streaming-full-model-materialization
              ac-affected-results-released is not satisfied despite the new unit tests. Wire
              evaluation/persistence through a sink (with InMemorySink preserving existing patch
              behavior) and add a behavioral test proving completed group tensors are handed to the
              sink without accumulating all affected results before later groups are evaluated."
