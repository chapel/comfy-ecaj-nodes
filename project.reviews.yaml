        entries:
          - _ulid: 01KQ7ZC44GDREQA765TXT74WFH
            author: codex
            body: "MUST-FIX: full saved model mode still accumulates all affected groups before materialization.
              The loop stores every group in affected_results and only writes to MaterializationSink
              after the GPU loop completes. That violates ac-direct-artifact-handoff and
              ac-affected-results-released: completed group tensors are not handed to
              materialization before later groups evaluate. I confirmed with a two-group runtime
              probe: ['open', 'eval:g1', 'eval:g2', 'write:g1', 'write:g1', 'write:g2', 'write:g2',
              'finalize']."
            created_at: 2026-04-27T17:21:43.056Z
          - _ulid: 01KQ80CWV27KC891V4WD88QQ6F
            author: "@claude"
            body: "Fixed: restructured the full mode GPU loop to evaluate groups lazily during sorted-key
              iteration. Each group is evaluated when its first affected key is encountered, and its
              results are written to the sink immediately. Group results are freed once all their
              keys are written. The old accumulate-all-then-write pattern is gone. Confirmed by
              updated TestFullModeEventOrder which uses two groups (4x4, 8x8) and asserts group 1
              writes complete before group 2 evaluation begins."
            created_at: 2026-04-27T17:39:36.929Z
