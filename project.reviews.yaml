          path: lib/incremental_writer.py
          side: head
        entries:
          - _ulid: 01KQ6ND19JFQ43TJC4TKWVCDGF
            author: Jacob Chapel
            body: "MUST-FIX: validation failures do not make the writer unpublishable. These branches raise for
              unexpected, duplicate, wrong-shape, and wrong-dtype writes, but they leave the writer
              open and unpoisoned; if the caller catches the RuntimeError and later writes the
              expected manifest keys, finalize() still publishes dest. I verified this with a direct
              script: duplicate, wrong_shape, wrong_dtype, and unexpected all printed 'finalized:
              True'. That violates the task requirement that
              duplicate/wrong-shape/wrong-dtype/inconsistent cases fail without publishing a
              cacheable artifact. Mark the writer failed and abort/cleanup on any validation/write
              error, or otherwise make finalize refuse after such an error."
            created_at: 2026-04-27T05:08:12.722Z
          - _ulid: 01KQ6NVQW7YQH732XCS1V2Y8GT
            author: "@claude"
            body: "Fixed: Validation errors (duplicate key, wrong shape, wrong dtype, unexpected key, byte size
              mismatch) now set _failed=True and immediately call abort() to close+cleanup the temp
              file. write_tensor() checks _failed before _aborted, so subsequent writes get the
              'aborted' error. finalize() independently checks _failed and refuses to publish.
              Extracted validation into _validate_tensor() with try/except that sets _failed and
              aborts before re-raising. Added 6 new behavioral tests proving each validation error
              type makes the writer permanently unpublishable — duplicate, wrong_shape, wrong_dtype,
              unexpected_key all verified to prevent finalize, plus tests for blocking further
              writes and immediate temp cleanup. All 21 incremental writer tests pass, full suite
              (1228) passes, ruff clean."
            created_at: 2026-04-27T05:16:14.598Z
        kind: blocker
        resolved_at: 2026-04-27T05:16:23.637Z
        resolved_by: "@claude"
