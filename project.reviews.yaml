            author: Jacob Chapel
            body: "MUST-FIX: the OOM retry path has the same retained local reference after each single-key
              write. Evidence: forcing the batch OOM path and inspecting the caller frame showed
              merged_cpu from key 'a' still present when key 'b' evaluation started. Impact: the
              fallback path does not release completed local result tensors before later retry keys
              are evaluated, which weakens the bounded-memory guarantee the sink-writing path is
              meant to provide."
