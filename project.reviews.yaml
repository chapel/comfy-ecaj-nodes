            author: "@claude"
            body: "Fixed: replaced bare torch.nn.Module with _HarnessDiffusionModel that exposes state_dict()
              and load_state_dict(). _HarnessModel now also implements state_dict() and
              load_state_dict() returning the full prefixed tensor dict, matching the contract that
              real ComfyUI ModelPatcher.clone() and model_state_dict() rely on."
            created_at: 2026-04-27T21:25:15.265Z
