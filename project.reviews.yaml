            author: Jacob Chapel
            body: "MUST-FIX: the normal chunk path writes slices to the sink but never releases the local
              merged_cpu batch before the next chunk starts. Evidence: an instrumented eval_fn
              inspecting the caller frame saw merged_cpu from the prior chunk still present when
              evaluating the next chunk. Impact: a streaming sink can still overlap the previous
              full CPU chunk with the next chunk's base/eval tensors, so this does not satisfy the
              task requirement to release local chunk references before later chunks are evaluated."
            created_at: 2026-04-27T05:31:18.308Z
          - _ulid: 01KQ6QBF1MTGAZTCYFTZ5C6QF0
            author: "@claude"
            body: "Fixed: Added 'del merged_cpu' after the sink write loop in the normal chunk path (line 435).
              The merged_cpu batch tensor is now explicitly released before the next chunk iteration
              begins its base_stack/base_gpu allocation. Added a behavioral test
              (test_merged_cpu_released_between_chunks) that uses frame inspection to verify
              merged_cpu is not present in the caller's locals when the next chunk's eval_fn
              executes."
            created_at: 2026-04-27T05:42:18.420Z
        kind: blocker
        resolved_at: 2026-04-27T05:42:32.297Z
