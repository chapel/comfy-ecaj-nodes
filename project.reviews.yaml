              inspect the saved/loaded artifact. It compares the patches-mode set patch tensors to
              the same injected merged dict used to stub chunked_evaluation, so a bug in
              CheckpointMaterializationSink, load_saved_model, or full-model artifact contents would
              not fail this test. The task explicitly calls for running both output modes and
              asserting downstream/application equivalence for affected keys."
