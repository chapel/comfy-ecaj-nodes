            body: "Fixed: Created streaming_evaluation_to_sink() in gpu_ops.py that takes a write_fn callback
              and hands each completed tensor to write_fn immediately after chunk evaluation — no
              dict accumulation. Full mode in exit.py now calls
              streaming_evaluation_to_sink(write_fn=sink.write_tensor) instead of
              evaluate_affected_group. evaluate_affected_group still exists for backward compat but
              is no longer called by full mode. Test updated to monkeypatch both chunked_evaluation
              AND evaluate_affected_group to raise, verifying full mode uses only
              streaming_evaluation_to_sink."
