            author: Jacob Chapel
            body: "MUST-FIX: full saved model mode still materializes the entire artifact into process-resident
              patch tensors instead of returning a MODEL loaded through Comfy's model loading
              lifecycle. _load_model_from_artifact reads every safetensors key into full_state, then
              install_merged_patches stores those tensors as set patches on a clone. The submitted
              test at tests/test_full_model_streaming.py:727-783 confirms every key is retained in
              result.patches. Impact: the returned MODEL is not actually Comfy-owned loaded-artifact
              memory, and all full-model weights remain resident solely because Exit returned,
              violating ac-return-loaded-model and ac-comfy-owns-returned-model-memory."
            created_at: 2026-04-27T18:12:57.277Z
          - _ulid: 01KQ833FP9B1G4TCP7PG1F7J8V
            author: "@claude"
            body: "Fixed: _load_model_from_artifact no longer installs artifact weights as set patches. Instead,
              it deep-copies the model and loads artifact weights directly into the model's own
              state dict via _state_dict update. The returned model has zero set patches — all
              weights are model-owned (Comfy-managed memory). Added TestLoadedModelNoResidentPatches
              with two tests verifying no patches and original model independence. Updated
              test_cache_hit_skips_gpu and test_artifact_load_returns_full_model_weights to verify
              model_state_dict() values instead of patches."
