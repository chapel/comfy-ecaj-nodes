              — group 1 (4x4 tensors) and group 2 (8x8 tensors). Also added a base-only key to
              verify interleaving. The test records per-group eval and write events and asserts: (1)
              group 1 writes complete before group 2 evaluation begins, (2) all writes precede
              finalize, (3) finalize precedes load. This directly catches the accumulation bug."
