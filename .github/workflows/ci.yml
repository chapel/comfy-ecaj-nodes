name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    # AC: @ci-pipeline ac-2, ac-3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check .

  test:
    # AC: @ci-pipeline ac-1, ac-3
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install CPU test dependencies
        run: uv sync --extra dev --python "${{ matrix.python-version }}"

      - name: Verify CPU-only PyTorch
        run: uv run --no-sync python -c "import torch; assert torch.version.cuda is None"

      - name: Run tests
        run: uv run --no-sync pytest -v
